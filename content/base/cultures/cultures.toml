[[culture]]
id = "elf_hall"
name = "Hall elves"
description = "The renouncers' culture, observed in Hall households: the Catechism (never bargain with the Fair Folk, never speak a sealed name, ring the bell, hallow the food, do not shelter the unrenounced, remember). Literate, careful provisioners, forage only what has been hallowed."
peoples = ["elf"]
languages = ["english", "norwegian", "german"]
literacy_pct = 97
name_pools = ["elf_hall"]
denominations = [{ id = "lutheran", pct = 40 }, { id = "catholic", pct = 20 }]
foodways = { staples = ["flour", "cornmeal", "salt_pork", "dried_apples"], festive = ["butter", "eggs", "cheese"], customs = ["Food from Fae-intensity 2 and above is hallowed with salt and a spoken grace before eating", "A twice-baked rye hearth-loaf is carried on any journey", "Hand-bell rung at doors, wells, and the edges of fields"] }

[[culture]]
id = "goblin_pare"
name = "Goblin pares"
description = "A pare is a working crew with its own friendly-society club: sick fund, burial dues, widows' share, and a club pantry. Mining is skilled labor, never capital. The Accord's courtesies (no whistling underground, crusts for the knockers) are a point of pare honor."
peoples = ["goblin"]
languages = ["english", "german"]
literacy_pct = 85
name_pools = ["goblin_pare"]
denominations = [{ id = "methodist", pct = 40 }, { id = "catholic", pct = 25 }]
foodways = { staples = ["flour", "potatoes", "salt_pork", "tea"], festive = ["butter", "cheese"], customs = ["Eat about two-thirds of a human ration, and carry the rest of the weight as tools", "Cellar and cave stores that spoil more slowly", "Crusts for the knockers"] }
