# Store restock tables (03 §8.2). OWNER: module:provisions.
# Pratt & Daughter orders from a Galena wholesaler: every week it tops up to `target_qty` at
# `wholesale_pct` of value. The owner's cash pays first; the rest goes on the wholesaler's
# account (the debt that drives Gussie's secret in 01 §8.3). The river is closed Dec-Mar.

[[restock]]
id = "pratt_wholesale"
place = "pratt_daughter_outfitters"
every_days = 7
wholesale_pct = 70
river_closed_months = [12, 1, 2, 3]
# Freeze-up does not stop trade, it slows it: sleighs on the river ice and wagons on the
# Prairie du Chien road bring about a third of a summer week's freight.
river_closed_pct = 35
# A river-town store feeds a town that buys its staples: Iron Ford's ~40 souls eat ~100,000
# kcal a day, so a week's freight is several hundred pounds of meal and flour plus pork and beans,
# and the shelves fill through the fall against freeze-up.
lines = [
  { item = "hardtack", target_qty = 120 },
  { item = "flour", target_qty = 1500, max_delivery = 450 },
  { item = "cornmeal", target_qty = 1000, max_delivery = 300 },
  { item = "potatoes", target_qty = 500, max_delivery = 200 },
  { item = "salt_pork", target_qty = 400, max_delivery = 120 },
  { item = "beans_dry", target_qty = 300, max_delivery = 80 },
  { item = "coffee_green", target_qty = 60 },
  { item = "dried_apples", target_qty = 240, max_delivery = 80 },
  { item = "lucifers_box", target_qty = 50 },
  { item = "flint_steel_char_tin", target_qty = 16 },
  { item = "tinder_pouch", target_qty = 24 },
  { item = "lard_oil_quart", target_qty = 20 },
]
