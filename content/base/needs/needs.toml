# Needs (0..1000, 1000 = satisfied). OWNER: module:needs-activities.
#
# Registry per 10 §3.4; physical rates per 05 §6 / 02 §11; social per 04 §3.3.
# Bands: the band with the smallest `below` that still exceeds the value applies, so list
# them highest first. A band's `condition` is switched on the actor's sheet while it applies.
# Calibration notes (so the numbers can be audited, P1/P8):
#   hunger  3 kcal/point. Decay 42/h awake at light labor; a normal day (16 h awake, 8 h
#           asleep at 70% labor x 50% asleep) burns ~790 points = ~2,370 kcal (05 §6.1: 2,400).
#           Heavy labor x1.5. +20% below 20 F. Missing a day puts you ~790 points behind.
#   thirst  2 ml/point. Decay 80/h: ~3 L on a normal day; +40% in July heat and under labor.
#   rest    Awake 55/h (about 18 h to Tired); sleep restores 110/h, so 8 h sleep = 16 h awake.
#           Heavy work costs 160%, a cold or hungry bed restores less (05 §6.4).

[[need]]
id = "hunger"
name = "Hunger"
kind = "physical"
description = "Calories against labor (05 §6.1). Fed by provisions via needs.feed(): 3 kcal to the point."
initial = 800
decay_per_hour = 42
asleep_pct = 50
labor_pct = { rest = 70, light = 100, heavy = 150 }
intake = { unit = "kcal", per_point = 3 }
temperature_pct = [{ below_f = 20, pct = 120, label = "Bitter cold" }]
bands = [
  { below = 600, label = "Peckish" },
  { below = 300, label = "Hungry", condition = "hungry" },
  { below = 100, label = "Starving", condition = "starving" },
]
urges = [{ activity = "take_meal", below = 600, ceiling = 900, drive = "hunger", label = "Hungry: eat something" }]

[need.debt]
cap = 6000
repay_pct = 50
bands = [
  { at_least = 1500, label = "Gaunt", condition = "gaunt" },
  { at_least = 4000, label = "Wasting", condition = "wasting" },
]

[[need]]
id = "thirst"
name = "Thirst"
kind = "physical"
description = "Water against heat and labor (05 §6.2): 3 L a day, 5 in July. Dehydration runs far faster than hunger."
initial = 850
decay_per_hour = 80
asleep_pct = 50
labor_pct = { rest = 70, light = 100, heavy = 160 }
intake = { unit = "ml", per_point = 2 }
temperature_pct = [
  { above_f = 80, pct = 130, label = "Warm day" },
  { above_f = 90, pct = 140, label = "Heat" },
]
bands = [
  { below = 500, label = "Thirsty", condition = "thirsty" },
  { below = 200, label = "Parched", condition = "parched" },
]
access = { place_tags = ["home", "water", "tavern", "store", "smithy", "mill", "church", "school"], below = 600, per_hour = 700 }
urges = [{ activity = "fetch_water", below = 600, ceiling = 900, drive = "hunger", label = "Parched: a drink of water" }]

[need.debt]
cap = 3000
repay_pct = 50
bands = [{ at_least = 600, label = "Dehydrated", condition = "dehydrated" }]

[[need]]
id = "rest"
name = "Rest"
kind = "physical"
description = "Hours awake and exertion (05 §6.4). Sleep restores about twice what waking costs."
initial = 800
decay_per_hour = 55
asleep_pct = 0
labor_pct = { rest = 70, light = 100, heavy = 160 }
bands = [
  { below = 300, label = "Tired", condition = "fatigued" },
  { below = 120, label = "Exhausted", condition = "exhausted" },
]
urges = [{ activity = "sleep", below = 600, ceiling = 800, drive = "sloth", label = "Weary: a bed would be welcome" }]
sleep_quality = [
  { need = "warmth", below = 450, pct = -25, label = "A cold bed" },
  { need = "warmth", below = 200, pct = -35, label = "Shivering" },
  { need = "hunger", below = 300, pct = -15, label = "Hungry belly" },
  { need = "thirst", below = 300, pct = -10, label = "Dry mouth" },
  { need = "security", below = 300, pct = -20, label = "Uneasy sleep" },
]

[need.debt]
cap = 4000
repay_pct = 50
bands = [{ at_least = 1500, label = "Sleep-starved", condition = "sleep_starved" }]

[[need]]
id = "warmth"
name = "Warmth"
