# Provisions: purchased food, from 03 §6.4 plus the P8 foods and foodways (00 P8, 12 §5.5, §8.6).
# OWNER: module:content-items. Every entry here has a `food` block with at least one prep.
#
# Units: lb (or quart, each) so servings and prep are sane. Prices are per unit (03 §6.4).
# Food fields per unit: kcal, protein_g, fat_g, fresh (0-100 per serving), servings (meal-sized).
# Prep: minutes, fire_minutes and cookware are per BATCH (batch_servings servings); water_ml per serving.
# Spoilage: temperature_pct per band (frozen/cold/cool/warm/hot), wet_pct while wetness > 20,
# packaging_pct per protection class (03 §3.7.4). `frozen` values above 100 approximate
# "spoils to ruin on freezing" (potatoes, eggs, apples) until provisions adds a frozen_ruins field.
# Calorie figures are real-world values for the foodstuff; shelf lives are period folk estimates.

