# SEED EXAMPLES of the item schema (packages/content/src/schema/items.ts).
# OWNER: module:content-items, who will transcribe all of 03 §6 and may rewrite/delete this
# file. Kept small but complete so every P8 field has a worked example.
#
# Units: weight_g per unit, value_cents per unit, bulk in Bulk (~quarts, one decimal).
# Food guideline: use small units (lb, quart, each) so servings and prep are sane. A
# "25-lb sack" is 25 units of flour (optionally inside a `flour_sack` container item).
# Prep: minutes/fire_minutes are per batch (<= batch_servings servings); water_ml per serving.

# --- Fire & fuel -------------------------------------------------------------------------

[[item]]
id = "firewood_armload"
name = "Armload of firewood"
section = "fire_light"
copy = "Split oak and dry ash. One armload keeps a cook-fire going about an hour."
unit = "armload"
weight_g = 9000
bulk = 20
value_cents = 2
materials = [{ material = "wood", pct = 100 }]
tags = ["flammable"]
supply = { kind = "fire", units = 60 }

[[item]]
id = "lucifers_box"
name = "Lucifers (friction matches), box of 100"
section = "fire_light"
copy = "Strike anywhere. Strike only where you mean to."
unit = "box of 100"
weight_g = 45
bulk = 0.1
value_cents = 5
materials = [{ material = "wood", pct = 80 }, { material = "paper", pct = 20 }]
affordances = { ignite = 2 }
tags = ["wet_ruin", "flammable"]
supply = { kind = "match", units = 100 }

[[item]]
id = "match_safe"
name = "Match safe, tinned brass, screw lid"
section = "fire_light"
copy = "A small thing to carry. The difference between a fire and a funeral."
weight_g = 90
bulk = 0.1
value_cents = 25
materials = [{ material = "brass", pct = 100 }]
container = { capacity_g = 60, capacity_bulk = 0.1, protects = ["waterproof", "crushproof"], carry = "pocket" }

[[item]]
id = "lard_oil_quart"
name = "Lard oil"
section = "fire_light"
copy = "Pressed from honest pork."
unit = "quart"
weight_g = 900
bulk = 1
value_cents = 30
materials = [{ material = "liquid", pct = 100 }]
tags = ["flammable"]
supply = { kind = "lamp_oil", units = 600 }

[[item]]
id = "glass_lantern"
name = "Glass lantern, lard-oil (Fenwick)"
section = "fire_light"
copy = "Fenwick's patent. See ten paces in a cave and keep both hands for climbing."
maker = "Fenwick Lamp Co."
weight_g = 1360
bulk = 4
value_cents = 150
shape = ["fragile"]
materials = [{ material = "tinplate", pct = 60 }, { material = "glass", pct = 40 }]
affordances = { light = 3 }
stackable = false
consumes = [{ kind = "lamp_oil", per = "hour", units = 60 }]

