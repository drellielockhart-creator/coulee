# Catalog 03 §6.9 Medicine & Remedies. OWNER: module:content-items.
# DECISION (P1): period remedies have TRUE simulated effects. `affordances` are the true effects
# (heal_bleed, heal_pain, heal_ague...); `truth` is the hidden description shown once the
# character knows it (03 §3.6). Dose supplies are per 03 §3.8 (laudanum 2 oz ≈ 16 doses).
# The carbolic row in 03 is omitted: it is not period (1867).

[[item]]
id = "linen_bandages"
name = "Linen bandages, roll"
section = "medicine"
copy = "Clean linen, boiled. Keep it in the oilcloth."
weight_g = 91
bulk = 0.2
value_cents = 15
truth = "Boiled linen binds bleeding as well as anything in the Book. Unboiled linen carries the fever in with it."
materials = [{ material = "linen", pct = 100 }]
