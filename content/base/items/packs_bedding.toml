# Catalog 03 §6.1 Packs & Bedding. OWNER: module:content-items.
# Units: weight_g per unit (lb * 453.6, rounded), value_cents per unit (Outfitter price at the
# river-town reference, 03 §8.1), bulk in Bulk (1 Bulk ~ 1 quart of awkward volume).
# Containers: capacity_bulk is the 03 "cap" column; capacity_g is a weight-capacity estimate.
# Insulation for bedding is `affordances.insulate` in °F of comfort-band extension (05 §6.3).
# Worn insulation is `wearable.insulation` in °F (03 points × 5, anchored to 05 §6.3).

