# Traits with psyche weights (04 §3.2; 10 §3, §7.1). OWNER: module:psyche.
#
# Each trait may shift: psyche (ego/superego/id_appetite, 0..100 after summing), 04 values
# (−3..+3), drive weights and norm strengths (0..100), voice loudness (voice_pct), specific
# urges (urge_bias), and defense style (defenses, pct; style = 10 × pct/100, 100 = neutral).
# No people carries a psyche profile (10 §1): traits come from upbringing and temperament.
#
# Shadow traits: drives.toml names the trait a projector pins on someone else
# (rage → hot_tempered, envy → envious, greed → covetous, lust → amorous, sloth → slothful,
# fear → timid, hunger → drunkard). Acquired traits (10 §7.1): suspicious, zealot.

# ---- Tongue and temper ------------------------------------------------------------------

[[trait]]
id = "gossip"
name = "Gossip"
period_label = "Of a Talkative Disposition"
description = "Cannot keep a good story to herself."
values = { discretion = -2 }
voice_pct = { id = 120, superego = 90 }
urge_bias = [{ kind = "interaction", id = "gossip", pct = 200 }]
defenses = { projection = 150 }
drives = { envy = 10 }
norms = { honesty = -10 }

