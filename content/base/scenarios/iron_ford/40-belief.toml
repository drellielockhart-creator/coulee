# Figures (rumor identities), beliefs, secrets and grudges. OWNER: module:content-world,
# using belief's scenario fields. Actors are scenario keys. Starting credences are deliberately low:
# the town has not yet decided anything about anyone.

[[figures]]
key = "bluff_witch"
name = "the Bluff Witch"
description = "A figure of campfire talk: a woman on the West Bluff who is said to dance with the wisps and sour the milk of those who cross her. Nobody has ever named her. Whoever she is, she is not any one person yet."
notoriety = 12

[[figures]]
key = "lantern_lady"
name = "the Lantern Lady"
description = "What the lower coulee says about the lights at night. Some say she leads people astray; others say she leads them home."
notoriety = 20

# --- Beliefs (what actors currently hold, voiced or not)

