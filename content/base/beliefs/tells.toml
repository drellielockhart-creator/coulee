# Tells (12 §7.2): events that count as Observation evidence on a kind predicate (04 §5.8).
# OWNER: module:belief.
#
# A tell fires for an actor truly of the predicate's `kind_of` people who is passing as
# something else (true_permille_per_hour), and as a LOOKALIKE for anyone else under the same
# conditions (lookalike_permille_per_hour). Observers can't tell the two apart: that's where
# false accusations come from. Rolls use the `suspicion` stream, hourly at T1.
# Unaging, fae greetings and habit gear wait for apparent age, fae actors and iron load (M2+).

[[tell]]
id = "iron_flinch"
name = "Iron flinch"
text = "{0} flinched from the iron"
predicate = "faekin"
strength = 25
true_permille_per_hour = 90
lookalike_permille_per_hour = 4
lookalikes = "a burn, palsy, nerves; anyone far gone in Drift"
place_tags_any = ["smithy", "ford", "mill"]
suppress = { kind = "save", id = "will", dc = 10 }
observe = { skill = "perception", dc = 10, add_disguise = true }

