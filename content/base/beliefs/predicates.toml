# Proposition predicates (04 §5.1). OWNER: module:belief.
#
# Arg 0 is the subject: the person (or Figure) the claim is about.
# juiciness 0..100 (gossip value), valence −100..100 (how the claim colors the subject),
# prior = starting credence of someone who has never considered it (04 §5.3).
# charge = can open a persecution process on the subject; act = it's a deed, not an identity
# (identity-only processes can't climb past rung 4, 04 §9.2).
# Mutation links (04 §8.5): exaggerates_to, supernaturalizes_to, moralizes_to, truncates_to.

