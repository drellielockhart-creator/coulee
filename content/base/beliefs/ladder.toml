# The escalation ladder (04 §9.2, canonical) and grudge aims (04 §6.3, §9.4).
# OWNER: module:belief. M1 implements rungs 0-3; 4-6 (Institutional, Hunt, Mob/Trial) come later.
#
# Thresholds are scaled by hard times and frightened minds (04 §9.1):
#   thr' = thr × (1000 − 350·M/1000) × (4000 − A_S) / (1000 × 4000)
# A rung with a step_interaction needs a Catalyst whose Ego picks that step (04 §9.4).
# Without fresh fuel a process steps down one rung after 2 × dwell_days.

