# Misfortune kinds (04 §3.3 pressure M; §5.4 attribution). OWNER: module:belief.
#
# severity: per mille added to the settlement's misfortune pressure M (decays τ = 30 days).
# base_permille_per_household_day: ambient frontier bad luck (about one misfortune a week across
#   Iron Ford's sixteen houses) until 05's world sim owns the physics (dead stock, sick
#   children, spoiled stores). Other modules can also report one through
#   belief.reportMisfortune(); provisions' spoiled cellar is the obvious caller.
# uncanny: the superstitious read it as a curse; attribution forms `cursed`, not `caused`.
# motive_traits: a projected trait that supplies a motive (10 §7.2: envy -> dried cows).
# Text slots: {0} = the household ("the Kvales", "Captain Hurd"), {0.poss} its possessive
# ("the Kvales'", "Captain Hurd's"), {1} = the victim's name.
# requires: what the household must have to be struck at all (home kind, members, a child).

[[misfortune]]
id = "cow_died"
name = "A cow sickened and died"
text = "{0.poss} best cow sickened and died"
uncanny = true
severity = 120
base_permille_per_household_day = 1
juiciness = 60
anxiety = 180
security_delta = -200
memory_intensity = 70
motive_traits = ["envy", "greed"]
aim = "expulsion"
requires = { home_kinds = ["farmstead", "house"], min_members = 2 }

