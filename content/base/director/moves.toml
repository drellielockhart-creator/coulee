# Ripening moves (DIRECTOR-PLAN §3.3; 05 §8.6): which nudge can advance a pattern, for which
# role, at what cost (05 §8.3 catalog). Patterns scapegoat, faekin_suspicion and defense_fired
# are refused by the schema (no faekin exposure; minds are read, never steered, in D1).
# Charm threads take no N4: talk of charms is the road to suspicion (05 §8.3); belief's
# nudgeablePredicate also refuses any claim that can mutate into a charge, kind or uncanny one.
# amount: per mille for N4 (topic score) and N8 (of the best option); DC points for N9;
# minutes for N6 (negative = sooner; suppress_amount = the delay when pacing holds a threat back).

# --- threats: ripened in BUILD (the top threat thread), held back by N6 in RELAX and PEAK
