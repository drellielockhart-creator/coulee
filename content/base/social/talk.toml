id = "toast_market"
on = ["toast"]
outcome = "success"
when = { observance = "market_day" }
lines = [
  { by = "initiator", text = "To market day, and the money we'll not keep!" },
  { by = "target", text = "Hear, hear!" },
]

[[talk]]
id = "toast_flat"
on = ["toast"]
outcome = "failure"
lines = [
  { by = "initiator", text = "A toast! To... to whatever it was." },
  { by = "target", text = "Sit down before you fall down." },
]

[[talk]]
id = "toast_nobody"
on = ["toast"]
outcome = "failure"
lines = [
  { by = "initiator", text = "Who'll drink with me? Anybody?" },
  { by = "target", text = "Put your purse away; nobody's drinking to that." },
]

[[talk]]
id = "tale_winter42"
on = ["tell_tale"]
outcome = "success"
lines = [
  { by = "initiator", text = "Did I ever tell you about the winter of '42, when the snow came up to the eaves?" },
  { by = "target", text = "Go on, then." },
]

[[talk]]
id = "tale_panther"
on = ["tell_tale"]
outcome = "success"
lines = [
  { by = "initiator", text = "There was a panther on the Kickapoo once, big as a yearling calf." },
  { by = "target", text = "And you with only a stick?" },
  { by = "initiator", text = "Only a stick, and my two legs, and they did the most of it." },
]

[[talk]]
id = "tale_ring"
on = ["tell_tale"]
outcome = "success"
lines = [
  { by = "initiator", text = "My grandmother swore she saw the hidden folk dancing in a ring, the night before the flood." },
  { by = "target", text = "I've heard worse stories, and believed them." },
]

[[talk]]
id = "tale_raft"
on = ["tell_tale"]
outcome = "success"
when = { venue = "tavern" }
lines = [
  { by = "initiator", text = "We took a raft of pine down to Galena in '49, and lost the cook at Cassville." },
  { by = "target", text = "Lost him how?" },
  { by = "initiator", text = "Married. Worse than drowned, he says." },
]

[[talk]]
id = "tale_tall"
on = ["tell_tale"]
outcome = "failure"
lines = [
  { by = "initiator", text = "...and the fish was longer than the boat." },
  { by = "target", text = "And I'm the Queen of England." },
]

[[talk]]
id = "tale_different"
on = ["tell_tale"]
outcome = "failure"
lines = [
  { by = "initiator", text = "So there I was, alone on the bluff, with the wolves all round..." },
  { by = "target", text = "You told it different last week. There were fewer wolves." },
]

[[talk]]
id = "comfort_right"
on = ["comfort"]
outcome = "success"
lines = [
  { by = "initiator", text = "It'll come right, {you}. These things do." },
  { by = "target", text = "#thanks#. I needed to hear it." },
]

[[talk]]
id = "comfort_coffee"
on = ["comfort"]
outcome = "success"
lines = [
  { by = "initiator", text = "Sit down. I'll put the coffee on." },
  { by = "target", text = "You're a good soul, {you}." },
]

[[talk]]
id = "comfort_fear"
on = ["comfort"]
outcome = "success"
when = { target_mood = "fear" }
lines = [
  { by = "initiator", text = "Whatever it is, you're not alone with it." },
  { by = "target", text = "That helps more than you know." },
]

[[talk]]
id = "comfort_pray"
on = ["comfort"]
outcome = "success"
when = { mood = "piety" }
lines = [
  { by = "initiator", text = "Cast your burden on the Lord, {you}, and some of it on me." },
  { by = "target", text = "#bless#." },
]

[[talk]]
id = "comfort_half"
on = ["comfort"]
outcome = "failure"
lines = [
  { by = "initiator", text = "Come now, it can't be as bad as all that." },
  { by = "target", text = "You don't know the half of it." },
]

[[talk]]
id = "comfort_alone"
on = ["comfort"]
outcome = "failure"
lines = [
  { by = "initiator", text = "Is there anything I can do, {you}?" },
  { by = "target", text = "Leave me be, if it's all the same to you." },
]

