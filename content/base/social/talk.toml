# =============================================================================================
# Faith
# =============================================================================================

[[talk]]
id = "preach_sabbath"
on = ["preach_at"]
outcome = "success"
lines = [
  { by = "initiator", text = "Remember the Sabbath, {you}, and keep it holy. Not for my sake: for yours." },
  { by = "target", text = "You're right, and I know it. I'll be there." },
]

[[talk]]
id = "preach_drink"
on = ["preach_at"]
outcome = "success"
when = { venue = "tavern" }
lines = [
  { by = "initiator", text = "Wine is a mocker, {you}, and strong drink is raging." },
  { by = "target", text = "#well#. Maybe I'll make this the last one." },
]

[[talk]]
id = "preach_soul"
on = ["preach_at"]
outcome = "success"
lines = [
  { by = "initiator", text = "What shall it profit a man, {you}, if he gain the whole world?" },
  { by = "target", text = "I've been asking myself the same, lately." },
]

[[talk]]
id = "preach_back"
on = ["preach_at"]
outcome = "failure"
lines = [
  { by = "initiator", text = "Remember the Sabbath, {you}, and keep it holy." },
  { by = "target", text = "And you remember to mind your own fences." },
]

[[talk]]
id = "preach_back_tavern"
on = ["preach_at"]
outcome = "failure"
when = { venue = "tavern" }
lines = [
  { by = "initiator", text = "Strong drink is raging, {you}." },
  { by = "target", text = "So am I, now. Leave me to my glass." },
]

[[talk]]
id = "pray_together"
on = ["pray_with"]
lines = [
  { by = "initiator", text = "Will you pray with me, {you}?" },
  { by = "target", text = "Gladly. Our Father, which art in heaven..." },
]

[[talk]]
id = "pray_rain"
on = ["pray_with"]
when = { weather = "rain", season = "summer" }
lines = [
  { by = "initiator", text = "Lord, send us dry weather for the hay, and patience if Thou wilt not." },
  { by = "target", text = "Amen." },
]

[[talk]]
id = "pray_spring"
on = ["pray_with"]
when = { season = "spring" }
lines = [
  { by = "initiator", text = "Bless the seed in the ground, Lord, and the hands that put it there." },
  { by = "target", text = "Amen, and keep the crows off it." },
]

[[talk]]
id = "pray_misfortune"
on = ["pray_with"]
when = { misfortune = true }
lines = [
  { by = "initiator", text = "Let us remember our neighbors in their trouble: {misfortune}." },
  { by = "target", text = "Lord, have mercy on them. Amen." },
]

[[talk]]
id = "pray_household"
on = ["pray_with"]
when = { household = true }
lines = [
  { by = "initiator", text = "Bless this house, Lord, and all under its roof." },
  { by = "target", text = "Amen." },
]

[[talk]]
id = "pray_sabbath"
on = ["pray_with"]
when = { sabbath = true, venue = "church" }
lines = [
  { by = "initiator", text = "The Lord be with you, {you}." },
  { by = "target", text = "And with you. A blessed Sabbath." },
]

[[talk]]
id = "confess_burden"
on = ["confess"]
lines = [
  { by = "initiator", text = "I've done a thing I'm ashamed of, {you}." },
  { by = "target", text = "Tell it, then, and be done carrying it." },
]

[[talk]]
id = "confess_listen"
on = ["confess"]
lines = [
  { by = "initiator", text = "I need to say something out loud, or it'll choke me." },
  { by = "target", text = "Say it. I'll not judge you; that's not my office." },
]

[[talk]]
id = "confess_shame"
on = ["confess"]
when = { mood = "shame" }
lines = [
  { by = "initiator", text = "I can't look myself in the glass, {you}." },
  { by = "target", text = "Then look at me, and tell me why." },
]

# =============================================================================================
# Amends
# =============================================================================================

[[talk]]
id = "apologize_sorry"
on = ["apologize"]
outcome = "success"
lines = [
  { by = "initiator", text = "I was wrong, {you}, and I'm sorry for it." },
  { by = "target", text = "#well#. It takes a big person to say so. Let's say no more." },
]

[[talk]]
id = "apologize_hand"
on = ["apologize"]
outcome = "success"
lines = [
  { by = "initiator", text = "I spoke out of turn. Will you shake on it?" },
  { by = "target", text = "I will. And I was no saint either." },
]

[[talk]]
id = "apologize_remember"
on = ["apologize"]
outcome = "success"
when = { target_remembers = "insult" }
lines = [
  { by = "initiator", text = "What I said {memory_place}: I've been sorry ever since." },
  { by = "target", text = "So have I, for letting it fester. Done, then." },
]

[[talk]]
id = "apologize_cold"
on = ["apologize"]
outcome = "failure"
lines = [
  { by = "initiator", text = "I was wrong, {you}, and I'm sorry for it." },
  { by = "target", text = "Words come cheap. We'll see." },
]

[[talk]]
id = "apologize_turned"
on = ["apologize"]
outcome = "failure"
lines = [
  { by = "initiator", text = "Can we put it behind us, {you}?" },
  { by = "target", text = "You can put it where you like. I'll keep mine." },
]

[[talk]]
id = "forgive_done"
on = ["forgive"]
lines = [
  { by = "initiator", text = "I've thought on it, {you}. It's forgiven." },
  { by = "target", text = "#thanks#. I'd not have blamed you for holding out." },
]

[[talk]]
id = "forgive_life"
on = ["forgive"]
lines = [
  { by = "initiator", text = "Life's too short, and the winters too long, to keep a grudge, {you}." },
  { by = "target", text = "Then we're square?" },
  { by = "initiator", text = "We're square." },
]

[[talk]]
id = "forgive_piety"
on = ["forgive"]
when = { mood = "piety" }
lines = [
  { by = "initiator", text = "Forgive us our trespasses, it says. I'd be a poor Christian not to." },
  { by = "target", text = "#bless#, {you}." },
]

