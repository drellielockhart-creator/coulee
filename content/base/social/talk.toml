outcome = "failure"
lines = [
  { by = "initiator", text = "{^target} could plow a field crooked with a rope for a guide." },
  { by = "target", text = "And you couldn't find the field." },
]

[[talk]]
id = "insult_fool"
on = ["insult"]
outcome = "success"
lines = [
  { by = "initiator", text = "You're #fool#, {you}, and everybody knows it but you." },
  { by = "target", text = "Say that again." },
]

[[talk]]
id = "insult_liar"
on = ["insult"]
outcome = "success"
lines = [
  { by = "initiator", text = "You're a liar and a cheat, and your word's not worth the breath." },
  { by = "target", text = "You'll answer for that." },
]

[[talk]]
id = "insult_remember"
on = ["insult"]
outcome = "success"
when = { remembers = "insult" }
lines = [
  { by = "initiator", text = "After what you said {memory_place}, you've a nerve showing your face." },
  { by = "target", text = "I'll show it where I please." },
]

[[talk]]
id = "insult_drunk"
on = ["insult"]
outcome = "success"
when = { mood = "drunk" }
lines = [
  { by = "initiator", text = "You! You're the worst of the lot, you are!" },
  { by = "target", text = "You're drunk. I'll mind it when you're sober." },
]

[[talk]]
id = "insult_shrug"
on = ["insult"]
outcome = "failure"
lines = [
  { by = "initiator", text = "You're #fool#, {you}." },
  { by = "target", text = "Better a fool than a bully. Go home." },
]

[[talk]]
id = "insult_laughed"
on = ["insult"]
outcome = "failure"
lines = [
  { by = "initiator", text = "Your word's not worth the breath, {you}." },
  { by = "target", text = "And yet here you are, wasting yours on me." },
]

[[talk]]
id = "threaten_pay"
on = ["threaten"]
outcome = "success"
lines = [
  { by = "initiator", text = "You'll pay, {you}. One way or another." },
  { by = "target", text = "I... I don't want any trouble." },
]

[[talk]]
id = "threaten_dark"
on = ["threaten"]
outcome = "success"
lines = [
  { by = "initiator", text = "It's a long walk home in the dark, {you}. Remember that." },
  { by = "target", text = "Is that a threat?" },
  { by = "initiator", text = "It's a long walk, is all." },
]

[[talk]]
id = "threaten_scorn"
on = ["threaten"]
outcome = "failure"
lines = [
  { by = "initiator", text = "You'll pay, {you}. One way or another." },
  { by = "target", text = "Big talk. Come and collect, then." },
]

[[talk]]
id = "fight_won"
on = ["fight"]
outcome = "success"
lines = [
  { by = "initiator", text = "Come on, then!" },
  { by = "target", text = "Enough! Enough, I say!" },
]

[[talk]]
id = "fight_won_drunk"
on = ["fight"]
outcome = "success"
when = { mood = "drunk" }
lines = [
  { by = "initiator", text = "Outside! Right now!" },
  { by = "target", text = "Get off me! Somebody pull {initiator_given} off!" },
]

[[talk]]
id = "fight_lost"
on = ["fight"]
outcome = "failure"
lines = [
  { by = "initiator", text = "Come on, then!" },
  { by = "target", text = "Had enough? Go home and put a steak on that eye." },
]

[[talk]]
id = "accuse_know"
on = ["accuse"]
outcome = "success"
lines = [
  { by = "initiator", text = "Let everyone hear it: I know what you are, {you}, and what you've done." },
  { by = "target", text = "That's a lie! Every word of it!" },
]

[[talk]]
id = "accuse_shame"
on = ["accuse"]
outcome = "success"
lines = [
  { by = "initiator", text = "You should be ashamed to show your face among decent people." },
  { by = "target", text = "And you should be ashamed of that tongue." },
]

[[talk]]
id = "accuse_nothing"
on = ["accuse"]
outcome = "success"
when = { told = false }
lines = [
  { by = "initiator", text = "There's something wrong about you, {you}, and I'll find out what." },
  { by = "target", text = "Find out, then, and leave me be till you do." },
]

[[talk]]
id = "accuse_flat"
on = ["accuse"]
outcome = "failure"
lines = [
  { by = "initiator", text = "Let everyone hear it: I know what you are!" },
  { by = "target", text = "Everyone hears you. Everyone knows you, too." },
]

[[talk]]
id = "accuse_said"
on = ["accuse"]
part = "said"
when = { about = "you" }
lines = [
  { by = "initiator", text = "{^rumor}. Deny it if you can." },
  { by = "target", text = "I do deny it, and I'll deny it to the end." },
]

[[talk]]
id = "accuse_said_third"
on = ["accuse"]
part = "said"
when = { about = "other" }
lines = [
  { by = "initiator", text = "They say {rumor}. Deny it if you can." },
  { by = "target", text = "I deny it. Shame on you for repeating it." },
]

[[talk]]
id = "shun_cut"
on = ["shun_lobby"]
outcome = "success"
lines = [
  { by = "initiator", text = "Have nothing more to do with them, {you}. No credit, no help, not a word." },
  { by = "target", text = "If you say so. I'll keep my distance." },
]

[[talk]]
id = "shun_nothing"
on = ["shun_lobby"]
outcome = "success"
when = { told = false }
lines = [
  { by = "initiator", text = "Keep away from bad company, {you}. You know who I mean." },
  { by = "target", text = "I think I do." },
]

[[talk]]
id = "shun_refuse"
on = ["shun_lobby"]
outcome = "failure"
lines = [
  { by = "initiator", text = "Have nothing more to do with them, {you}." },
  { by = "target", text = "I'll choose my own neighbors, thank you." },
]

[[talk]]
id = "shun_said"
on = ["shun_lobby"]
part = "said"
lines = [
  { by = "initiator", text = "{^hedge} {rumor}. Decent people will have nothing to do with it." },
  { by = "target", text = "I'll bear it in mind." },
]

# =============================================================================================
# Children: when a child is party to it, their own lines come first
# =============================================================================================

[[talk]]
id = "kid_chat_help"
on = ["chat"]
when = { child = true, target_child = false }
lines = [
  { by = "initiator", text = "Can I help, {you}?" },
  { by = "target", text = "You can fetch the kindling, and mind your fingers." },
]

[[talk]]
id = "kid_chat_why"
on = ["chat"]
when = { child = true, target_child = false }
lines = [
  { by = "initiator", text = "{you}, why does {creek} run backwards in a flood?" },
  { by = "target", text = "It doesn't. It only looks it. Ask me another." },
]

[[talk]]
id = "kid_chat_snow"
on = ["chat"]
when = { child = true, weather = "snow" }
lines = [
  { by = "initiator", text = "Snow! Will there be sledding?" },
  { by = "target", text = "After the chores, and not before." },
]

[[talk]]
id = "kid_chat_lights"
on = ["chat"]
when = { child = true, target_child = false, part = "evening" }
lines = [
  { by = "initiator", text = "Is it true about the lights on the bluff, {you}?" },
  { by = "target", text = "Never you mind the lights. Bed." },
]

[[talk]]
id = "kid_chat_adult"
on = ["chat"]
when = { child = false, target_child = true }
lines = [
  { by = "initiator", text = "Minding your elders, {you}?" },
  { by = "target", text = "Mostly." },
]

[[talk]]
id = "kid_chat_adult_grown"
on = ["chat"]
when = { child = false, target_child = true }
lines = [
  { by = "initiator", text = "Look how you've grown, {you}. You'll be taller than me by harvest." },
  { by = "target", text = "Taller than anybody, I mean to be." },
]

[[talk]]
id = "kid_chat_kids"
on = ["chat"]
when = { child = true, target_child = true }
lines = [
  { by = "initiator", text = "I can hold my breath longer than you." },
  { by = "target", text = "Can not." },
  { by = "initiator", text = "Can so." },
]

[[talk]]
id = "kid_chat_kids_frog"
on = ["chat"]
when = { child = true, target_child = true }
lines = [
  { by = "initiator", text = "I found a frog down by {creek}. A big one." },
  { by = "target", text = "Show me!" },
]

[[talk]]
id = "kid_intro"
on = ["introduce"]
when = { child = true }
lines = [
  { by = "initiator", text = "I'm {initiator_given}. Who are you?" },
  { by = "target", text = "{target_given}. Pleased to meet you." },
]

[[talk]]
id = "kid_intro_adult"
on = ["introduce"]
when = { target_child = true, child = false }
lines = [
  { by = "initiator", text = "And who might you be?" },
  { by = "target", text = "{target_given}. I live just there." },
]

[[talk]]
id = "kid_help"
on = ["help"]
when = { child = true }
lines = [
  { by = "initiator", text = "I can carry that, {you}. I'm strong." },
  { by = "target", text = "So you are. Mind the step." },
]

[[talk]]
id = "kid_help_adult"
on = ["help"]
when = { child = false, target_child = true }
lines = [
  { by = "initiator", text = "Here, {you}, let me show you how." },
  { by = "target", text = "I nearly had it." },
]

[[talk]]
id = "kid_pray"
on = ["pray_with"]
when = { target_child = true }
lines = [
  { by = "initiator", text = "Now I lay me down to sleep, {you}. Say it with me." },
  { by = "target", text = "I pray the Lord my soul to keep." },
]

[[talk]]
id = "kid_pray_self"
on = ["pray_with"]
when = { child = true }
lines = [
  { by = "initiator", text = "Will you say grace with me, {you}?" },
  { by = "target", text = "Fold your hands, then." },
]

[[talk]]
id = "kid_comfort"
on = ["comfort"]
outcome = "success"
when = { target_child = true }
lines = [
  { by = "initiator", text = "There now, {you}. Dry your eyes. It's mended already." },
  { by = "target", text = "Is it?" },
  { by = "initiator", text = "Near enough." },
]

[[talk]]
id = "kid_tease"
on = ["mock", "insult", "slight"]
when = { child = true, target_child = true }
lines = [
  { by = "initiator", text = "{target_given} smells like the pig pen!" },
  { by = "target", text = "Take it back!" },
]

[[talk]]
id = "kid_cheek"
on = ["mock", "insult", "slight"]
when = { child = true, target_child = false }
lines = [
  { by = "initiator", text = "Shan't, and you can't make me." },
  { by = "target", text = "We'll see what your people say to that." },
]

[[talk]]
id = "kid_scold"
on = ["insult", "slight", "mock", "threaten"]
when = { child = false, target_child = true }
lines = [
  { by = "initiator", text = "Out from underfoot, {you}, before I tan your hide." },
  { by = "target", text = "I wasn't doing anything!" },
]

[[talk]]
id = "kid_tale"
on = ["tell_tale"]
when = { target_child = true }
lines = [
  { by = "initiator", text = "Did I ever tell you about the panther on the Kickapoo, {you}?" },
  { by = "target", text = "Tell it again!" },
]

[[talk]]
id = "kid_gift"
on = ["gift"]
when = { target_child = true }
lines = [
  { by = "initiator", text = "A peppermint for you, {you}. Don't tell."},
  { by = "target", text = "I won't! Thank you!" },
]
