# Comfort, compliments, introductions, warnings, sermons, toasts, gifts, money, amends, courtship and sharper
# edges, wave 5 (group D). OWNER: module:social. Read by packages/core/src/social/talk.ts, same rules as
# talk.toml. Each of these pools was small enough that a pair of neighbors heard the same lines inside a week.

# =============================================================================================
# Comfort
# =============================================================================================

[[talk]]
id = "comfort_hand"
on = ["comfort"]
outcome = "success"
weight = 12
lines = [
  { by = "initiator", text = "Here. Take my hand a minute." },
  { by = "target", text = "I'm all right. I will be." },
]

[[talk]]
id = "comfort_stew"
on = ["comfort"]
outcome = "success"
weight = 12
lines = [
  { by = "initiator", text = "I've a pot of something hot on. Come and eat." },
  { by = "target", text = "I couldn't. ...Perhaps a little." },
]

[[talk]]
id = "comfort_walk"
on = ["comfort"]
outcome = "success"
weight = 12
lines = [
  { by = "initiator", text = "Walk with me. You needn't talk." },
  { by = "target", text = "Thank you. I don't think I can." },
]

[[talk]]
id = "comfort_night"
on = ["comfort"]
outcome = "success"
weight = 4
when = { part = "night" }
lines = [
  { by = "initiator", text = "It's late. Whatever it is, it'll look smaller in the morning." },
  { by = "target", text = "It won't. But I'll try to believe you." },
]

[[talk]]
id = "comfort_worst"
on = ["comfort"]
outcome = "success"
weight = 8
when = { target_mood = "anxious" }
lines = [
  { by = "initiator", text = "What's the worst of it? Say it aloud, and it shrinks." },
  { by = "target", text = "That we'll lose the place." },
  { by = "initiator", text = "Then we'll say it twice more tomorrow, and it'll be a story." },
]

[[talk]]
id = "comfort_shame_all"
on = ["comfort"]
outcome = "success"
weight = 8
when = { target_mood = "shame" }
lines = [
  { by = "initiator", text = "We've all done something. You're not the first." },
  { by = "target", text = "That doesn't help. ...But it does, a little." },
]

[[talk]]
id = "comfort_homesick"
on = ["comfort"]
outcome = "success"
weight = 8
when = { target_mood = "longing" }
lines = [
  { by = "initiator", text = "Tell me about the place. All of it." },
  { by = "target", text = "There's a creek. You'd like the creek." },
]

[[talk]]
id = "comfort_barred"
on = ["comfort"]
outcome = "success"
weight = 8
when = { target_mood = "fear" }
lines = [
  { by = "initiator", text = "Whatever it is, the door's barred and I'm sitting by it." },
  { by = "target", text = "Stay a while, then." },
]

[[talk]]
id = "comfort_pastor"
on = ["comfort"]
outcome = "success"
weight = 8
when = { initiator = { occupation = ["pastor", "lay_preacher"] } }
lines = [
  { by = "initiator", text = "The Lord gives and takes. But I'll sit with you all the same." },
  { by = "target", text = "Thank you. That's the part I needed." },
]

[[talk]]
id = "comfort_rain_in"
on = ["comfort"]
outcome = "success"
weight = 4
when = { weather = "rain" }
lines = [
  { by = "initiator", text = "Come in out of the wet. Whatever it is can be said by the fire." },
  { by = "target", text = "That's kind. I'll take the fire first." },
]

[[talk]]
id = "comfort_friend_arm"
on = ["comfort"]
outcome = "success"
weight = 8
when = { label = "friend" }
lines = [
  { by = "initiator", text = "You needn't say anything, {you}. I'm only here." },
  { by = "target", text = "That's all I want. Thank you." },
]

[[talk]]
id = "comfort_kin_blood"
on = ["comfort"]
outcome = "success"
weight = 8
when = { kin = true }
lines = [
  { by = "initiator", text = "We're family. We don't need to explain." },
  { by = "target", text = "No. We never did. Sit by me." },
]

[[talk]]
id = "comfort_courting_close"
on = ["comfort"]
outcome = "success"
weight = 8
when = { courting = true }
lines = [
  { by = "initiator", text = "Lean on me, {you}. I'm sturdier than I look." },
  { by = "target", text = "I know. I'm leaning." },
]

[[talk]]
id = "comfort_kid_2"
on = ["comfort"]
outcome = "success"
weight = 8
when = { target_child = true }
lines = [
  { by = "initiator", text = "There, there. Come here and tell me." },
  { by = "target", text = "It hurts." },
  { by = "initiator", text = "I know. It'll stop." },
]

[[talk]]
id = "comfort_kid_3"
on = ["comfort"]
outcome = "success"
weight = 8
when = { target_child = true }
lines = [
  { by = "initiator", text = "Shall I kiss it better?" },
  { by = "target", text = "Yes. ...Better." },
  { by = "initiator", text = "Good. That's all the medicine I know." },
]

[[talk]]
id = "comfort_winter"
on = ["comfort"]
outcome = "success"
weight = 4
when = { season = "winter" }
lines = [
  { by = "initiator", text = "Sit by the stove. I'll bring you a blanket." },
  { by = "target", text = "You're a good soul." },
]

[[talk]]
id = "comfort_not_so_bad"
on = ["comfort"]
outcome = "failure"
weight = 12
lines = [
  { by = "initiator", text = "It isn't so bad as it seems." },
  { by = "target", text = "It is." },
  { by = "initiator", text = "Then it's as bad as it seems, and I'm here anyway." },
]

[[talk]]
id = "comfort_worse_off"
on = ["comfort"]
outcome = "failure"
weight = 12
lines = [
  { by = "initiator", text = "There are others worse off." },
  { by = "target", text = "That's no comfort at all." },
]

[[talk]]
id = "comfort_pray_on_it"
on = ["comfort"]
outcome = "failure"
weight = 12
lines = [
  { by = "initiator", text = "Pray on it." },
  { by = "target", text = "I have. It isn't enough." },
]

[[talk]]
id = "comfort_morning"
on = ["comfort"]
outcome = "failure"
weight = 12
lines = [
  { by = "initiator", text = "You'll feel better in the morning." },
  { by = "target", text = "I won't. And you'll have said it anyway." },
]

[[talk]]
id = "comfort_be_grateful"
on = ["comfort"]
outcome = "failure"
weight = 12
lines = [
  { by = "initiator", text = "You should be grateful, {you}, for what you've got." },
  { by = "target", text = "Don't." },
]

[[talk]]
id = "comfort_stranger_no"
on = ["comfort"]
outcome = "failure"
weight = 8
when = { label = "stranger" }
lines = [
  { by = "initiator", text = "Can I help in any way?" },
  { by = "target", text = "You can't, but you're kind to ask." },
]

# =============================================================================================
# Compliments
# =============================================================================================

[[talk]]
id = "compliment_coat"
on = ["compliment"]
outcome = "success"
weight = 12
lines = [
  { by = "initiator", text = "That's a handsome coat, {you}." },
  { by = "target", text = "It was my father's. It's got his temper still." },
]

[[talk]]
id = "compliment_rows"
on = ["compliment"]
outcome = "success"
weight = 8
when = { target = { occupation = ["farmer", "farm_wife"] } }
lines = [
  { by = "initiator", text = "Your rows are the straightest on the creek." },
  { by = "target", text = "Time, string, and a bad temper. In that order." },
]

[[talk]]
id = "compliment_horse"
on = ["compliment"]
outcome = "success"
weight = 8
when = { target = { occupation = ["farmer", "hired_hand", "ferryman"] } }
lines = [
  { by = "initiator", text = "That's a good horse, {you}." },
  { by = "target", text = "He thinks so. He's insufferable about it." },
]

[[talk]]
id = "compliment_garden"
on = ["compliment"]
outcome = "success"
weight = 4
when = { season = "summer" }
lines = [
  { by = "initiator", text = "Your garden is the envy of the creek." },
  { by = "target", text = "It's the soil. And the worrying. I don't let the beans alone for a minute." },
]

[[talk]]
id = "compliment_scale"
on = ["compliment"]
outcome = "success"
weight = 8
when = { target = { occupation = ["storekeeper", "miller"] } }
lines = [
  { by = "initiator", text = "You keep a fair scale, {you}. I've never doubted the weight." },
  { by = "target", text = "That's the best thing anyone's said all week." },
]

[[talk]]
id = "compliment_iron"
on = ["compliment"]
outcome = "success"
weight = 8
when = { target = { occupation = "blacksmith" } }
lines = [
  { by = "initiator", text = "That's good iron, {you}." },
  { by = "target", text = "It's the fire. The iron would be nothing without it." },
]

[[talk]]
id = "compliment_teacher"
on = ["compliment"]
outcome = "success"
weight = 8
when = { target = { occupation = "schoolteacher" } }
lines = [
  { by = "initiator", text = "The children speak well of you." },
  { by = "target", text = "They speak well of the holidays. But I'll take it." },
]

[[talk]]
id = "compliment_page"
on = ["compliment"]
outcome = "success"
weight = 8
when = { target = { occupation = "editor_printer" } }
lines = [
  { by = "initiator", text = "A clean page this week, {you}. Hardly a misprint." },
  { by = "target", text = "Hardly. I've put them all in the advertisements." },
]

[[talk]]
id = "compliment_sermon_2"
on = ["compliment"]
outcome = "success"
weight = 8
when = { target = { occupation = ["pastor", "lay_preacher"] } }
lines = [
  { by = "initiator", text = "That text of yours stuck with me." },
  { by = "target", text = "It stuck with me too. I couldn't dislodge it Saturday night." },
]

[[talk]]
id = "compliment_ferry"
on = ["compliment"]
outcome = "success"
weight = 8
when = { target = { occupation = "ferryman" } }
lines = [
  { by = "initiator", text = "You never lose a passenger, {you}." },
  { by = "target", text = "Not yet. I count them twice." },
]

[[talk]]
id = "compliment_bread_2"
on = ["compliment"]
outcome = "success"
weight = 12
lines = [
  { by = "initiator", text = "That bread of yours would raise the dead." },
  { by = "target", text = "Don't give me ideas. The cemetery's rather full." },
]

[[talk]]
id = "compliment_child"
on = ["compliment"]
outcome = "success"
weight = 8
when = { target_child = true }
lines = [
  { by = "initiator", text = "You're getting tall, {you}." },
  { by = "target", text = "I'm going to be taller than Pa." },
  { by = "initiator", text = "I wouldn't wonder." },
]

[[talk]]
id = "compliment_voice"
on = ["compliment"]
outcome = "success"
weight = 4
when = { venue = "church" }
lines = [
  { by = "initiator", text = "You've a fine singing voice, {you}." },
  { by = "target", text = "Only for the Lord and the cows. They don't mind the flat notes." },
]

[[talk]]
id = "compliment_cheerful"
on = ["compliment"]
outcome = "success"
weight = 8
when = { target_mood = "easy" }
lines = [
  { by = "initiator", text = "It does a body good to see you cheerful." },
  { by = "target", text = "Don't tell the weather. It'll hear and turn." },
]

[[talk]]
id = "compliment_neat"
on = ["compliment"]
outcome = "success"
weight = 4
when = { venue = "farm" }
lines = [
  { by = "initiator", text = "Everything on your place is so neat and square." },
  { by = "target", text = "It's habit. I can't bear a crooked fence." },
]

[[talk]]
id = "compliment_courting_2"
on = ["compliment"]
outcome = "success"
weight = 8
when = { courting = true }
lines = [
  { by = "initiator", text = "You look well in that color, {you}." },
  { by = "target", text = "It's the only color I've got. But thank you." },
]

[[talk]]
id = "compliment_flattery"
on = ["compliment"]
outcome = "failure"
weight = 12
lines = [
  { by = "initiator", text = "Flattery, you'll say. But it's true all the same." },
  { by = "target", text = "Oh, I'll say it anyway." },
]

[[talk]]
id = "compliment_what_want"
on = ["compliment"]
outcome = "failure"
weight = 12
lines = [
  { by = "initiator", text = "What a fine day you're having, {you}!" },
  { by = "target", text = "What do you want?" },
]

[[talk]]
id = "compliment_hollow"
on = ["compliment"]
outcome = "failure"
weight = 12
lines = [
  { by = "initiator", text = "You're looking very well." },
  { by = "target", text = "I'm looking exactly as I did yesterday. You didn't notice then." },
]

[[talk]]
id = "compliment_cool"
on = ["compliment"]
outcome = "failure"
weight = 12
lines = [
  { by = "initiator", text = "I've always admired your..." },
  { by = "target", text = "My what?" },
  { by = "initiator", text = "...your steadiness." },
]

[[talk]]
id = "compliment_stranger_2"
on = ["compliment"]
outcome = "failure"
weight = 8
when = { label = "stranger" }
lines = [
  { by = "initiator", text = "Forgive me, but that's a fine hat." },
  { by = "target", text = "It's a hat. Good day." },
]

# =============================================================================================
# Introductions
# =============================================================================================

[[talk]]
id = "intro_cabin"
on = ["introduce"]
weight = 12
lines = [
  { by = "initiator", text = "{initiator}, lately of #homeland#. I've taken the cabin by the creek." },
  { by = "target", text = "{target}. You'll want the miller about grinding, and the storekeeper about credit, in that order." },
]

[[talk]]
id = "intro_norwegian"
on = ["introduce"]
weight = 8
when = { initiator = { culture = "norwegian" } }
lines = [
  { by = "initiator", text = "Goddag. {initiator}. I'm learning English the hard way, with a plow." },
  { by = "target", text = "{target}. We all are." },
]

[[talk]]
id = "intro_german"
on = ["introduce"]
weight = 8
when = { initiator = { culture = "german" } }
lines = [
  { by = "initiator", text = "{initiator}. From Baden, by way of Milwaukee, and I regret nothing." },
  { by = "target", text = "{target}. A good start. Most folk regret something by Milwaukee." },
]

[[talk]]
id = "intro_irish"
on = ["introduce"]
weight = 8
when = { initiator = { culture = "irish" } }
lines = [
  { by = "initiator", text = "{initiator}. God save all here." },
  { by = "target", text = "{target}. And you. Come in out of the road." },
]

[[talk]]
id = "intro_cornish"
on = ["introduce"]
weight = 8
when = { initiator = { culture = "cornish" } }
lines = [
  { by = "initiator", text = "{initiator}. Out of Cornwall, by way of the lead. Do you know the mines?" },
  { by = "target", text = "{target}. Only by reputation, and the hats." },
]

[[talk]]
id = "intro_yankee"
on = ["introduce"]
weight = 8
when = { initiator = { culture = "yankee" } }
lines = [
  { by = "initiator", text = "{initiator}, from New England. I've come to see the country." },
  { by = "target", text = "{target}. You'll see it. It's mostly mud, in spring." },
]

[[talk]]
id = "intro_rain"
on = ["introduce"]
weight = 4
when = { weather = "rain" }
lines = [
  { by = "initiator", text = "{initiator}. Forgive the state of me; the road took a fancy to my boots." },
  { by = "target", text = "{target}. It does that to everyone. You get used to it." },
]

[[talk]]
id = "intro_morning"
on = ["introduce"]
weight = 4
when = { part = "morning" }
lines = [
  { by = "initiator", text = "Good morning. {initiator}. I'm told you're the person to ask about the road." },
  { by = "target", text = "{target}. I am, and the answer is: avoid it." },
]

[[talk]]
id = "intro_school"
on = ["introduce"]
weight = 4
when = { venue = "school" }
lines = [
  { by = "initiator", text = "{initiator}. I've come to see about a place for my boy." },
  { by = "target", text = "{target}. We've room, if he doesn't mind the stove." },
]

[[talk]]
id = "intro_mill"
on = ["introduce"]
weight = 4
when = { venue = "mill" }
lines = [
  { by = "initiator", text = "{initiator}. I've a sack to grind and no notion of the toll." },
  { by = "target", text = "{target}. We'll settle it fair. Fair is the only way to stay in business." },
]

[[talk]]
id = "intro_smith"
on = ["introduce"]
weight = 4
when = { venue = "smithy" }
lines = [
  { by = "initiator", text = "{initiator}. I've a cracked axle and a worse temper." },
  { by = "target", text = "{target}. Bring both. I can mend the first." },
]

[[talk]]
id = "intro_landing"
on = ["introduce"]
weight = 4
when = { venue = "landing" }
lines = [
  { by = "initiator", text = "{initiator}. Is this the ferry?" },
  { by = "target", text = "{target}. It is, if the river's willing. It isn't always." },
]

[[talk]]
id = "intro_farm"
on = ["introduce"]
weight = 4
when = { venue = "farm" }
lines = [
  { by = "initiator", text = "{initiator}. I was told you might know of work." },
  { by = "target", text = "{target}. There's always work. It's the paying that's rare." },
]

[[talk]]
id = "intro_print"
on = ["introduce"]
weight = 4
when = { venue = "print" }
lines = [
  { by = "initiator", text = "{initiator}. I thought I might put a notice in your paper." },
  { by = "target", text = "{target}. Welcome. It's two bits a line, and I'll spell your name right if I can." },
]

[[talk]]
id = "intro_mine"
on = ["introduce"]
weight = 4
when = { venue = "mine" }
lines = [
  { by = "initiator", text = "{initiator}. I'm looking for work underground." },
  { by = "target", text = "{target}. Can you stand the dark and the damp?" },
  { by = "initiator", text = "I've tried the alternatives." },
]

[[talk]]
id = "intro_child"
on = ["introduce"]
weight = 8
when = { child = true }
lines = [
  { by = "initiator", text = "I'm {initiator}. Want to be friends?" },
  { by = "target", text = "{target}. All right. Do you have a dog?" },
]

[[talk]]
id = "intro_to_child"
on = ["introduce"]
weight = 7
when = { child = false, target_child = true }
lines = [
  { by = "initiator", text = "And what's your name, young {target_given}?" },
  { by = "target", text = "{target}. I'm seven and three-quarters." },
]

[[talk]]
id = "intro_elder"
on = ["introduce"]
weight = 8
when = { initiator = { age = "elder" } }
lines = [
  { by = "initiator", text = "{initiator}. Old enough to say what I like, I find." },
  { by = "target", text = "{target}. Then we'll get along. I'm the same." },
]

[[talk]]
id = "intro_evening_2"
on = ["introduce"]
weight = 4
when = { part = "evening" }
lines = [
  { by = "initiator", text = "Forgive me, it's late. {initiator}. I've just come off the road." },
  { by = "target", text = "{target}. Take a chair. The supper's not past helping." },
]

[[talk]]
id = "intro_winter"
on = ["introduce"]
weight = 4
when = { temp = "freezing" }
lines = [
  { by = "initiator", text = "{initiator}. I'd shake your hand, but I can't feel mine." },
  { by = "target", text = "{target}. Come to the stove. We'll count your fingers together." },
]

# =============================================================================================
# Warnings, sermons, toasts, gifts
# =============================================================================================

[[talk]]
id = "warn_sit"
on = ["warn"]
weight = 4
when = { told = true }
lines = [
  { by = "initiator", text = "You'll want to hear this sitting down." },
  { by = "target", text = "Sit, then. Go on." },
]

[[talk]]
id = "warn_wind"
on = ["warn"]
weight = 4
when = { told = true }
lines = [
  { by = "initiator", text = "I've heard something you'd rather not." },
  { by = "target", text = "Better from you than from the wind." },
]

[[talk]]
id = "warn_dusk"
on = ["warn"]
weight = 2
when = { told = true, part = "evening" }
lines = [
  { by = "initiator", text = "Walk home with a lantern tonight, {you}." },
  { by = "target", text = "Why? What have you heard?" },
]

[[talk]]
id = "warn_rain"
on = ["warn"]
weight = 2
when = { told = true, weather = "rain" }
lines = [
  { by = "initiator", text = "Keep off the low road, {you}. The bridge is out." },
  { by = "target", text = "And the ford?" },
  { by = "initiator", text = "Don't ask the ford." },
]

[[talk]]
id = "warn_privy"
on = ["warn"]
weight = 5
when = { told = true, label = "friend" }
lines = [
  { by = "initiator", text = "A word in your ear, {you}, and I'd be obliged if it stayed there." },
  { by = "target", text = "It will. Say it." },
]

[[talk]]
id = "warn_nothing_vague"
on = ["warn"]
weight = 4
when = { told = false }
lines = [
  { by = "initiator", text = "Nothing in particular. Only be careful, {you}." },
  { by = "target", text = "Of what?" },
  { by = "initiator", text = "Everything, generally." },
]

[[talk]]
id = "warn_nothing_roads"
on = ["warn"]
weight = 2
when = { told = false, weather = "rain" }
lines = [
  { by = "initiator", text = "The roads are poor tonight. That's all I mean." },
  { by = "target", text = "I'll mind them." },
]

[[talk]]
id = "warn_nothing_cold"
on = ["warn"]
weight = 2
when = { told = false, temp = "freezing" }
lines = [
  { by = "initiator", text = "Wrap up well, {you}. It's bitter out." },
  { by = "target", text = "I will. Thank you." },
]

[[talk]]
id = "warn_nothing_strangers"
on = ["warn"]
weight = 2
when = { told = false, part = "evening" }
lines = [
  { by = "initiator", text = "There are strangers on the road. Keep to company." },
  { by = "target", text = "Whose strangers?" },
  { by = "initiator", text = "That's the trouble: nobody's." },
]

[[talk]]
id = "preach_judge"
on = ["preach_at"]
outcome = "success"
weight = 12
lines = [
  { by = "initiator", text = "Judge not, that ye be not judged, {you}." },
  { by = "target", text = "I... will try to remember it." },
]

[[talk]]
id = "preach_idle"
on = ["preach_at"]
outcome = "success"
weight = 12
lines = [
  { by = "initiator", text = "The idle hand is the devil's workshop, {you}." },
  { by = "target", text = "Then I'll find work for it. Thank you." },
]

[[talk]]
id = "preach_pride"
on = ["preach_at"]
outcome = "success"
weight = 12
lines = [
  { by = "initiator", text = "Pride goeth before destruction, {you}." },
  { by = "target", text = "Then I'll walk with my head down until I see the cliff." },
]

[[talk]]
id = "preach_bread"
on = ["preach_at"]
outcome = "success"
weight = 8
when = { mood = "piety" }
lines = [
  { by = "initiator", text = "Man shall not live by bread alone. Though it helps." },
  { by = "target", text = "You've made me hungry and humble. Both." },
]

[[talk]]
id = "preach_heal"
on = ["preach_at"]
outcome = "failure"
weight = 4
when = { sabbath = true }
lines = [
  { by = "initiator", text = "Remember the Sabbath, {you}. It remembers you." },
