# =============================================================================================
# Money: lending, borrowing, repaying, dunning
# =============================================================================================

[[talk]]
id = "lend_neighbor"
on = ["lend"]
weight = 12
lines = [
  { by = "initiator", text = "Take {cents}, {you}. Pay when you can, and not before." },
  { by = "target", text = "That's more trust than I deserve." },
]

[[talk]]
id = "lend_spring"
on = ["lend"]
weight = 4
when = { season = "spring" }
lines = [
  { by = "initiator", text = "{^cents} for seed. You can pay it back at harvest." },
  { by = "target", text = "It'll be the first thing I pay." },
]

[[talk]]
id = "lend_winter"
on = ["lend"]
weight = 4
when = { season = "winter" }
lines = [
  { by = "initiator", text = "{^cents} for the winter, {you}. Keep the children warm." },
  { by = "target", text = "I'll not forget it." },
]

[[talk]]
id = "lend_reluctant"
on = ["lend"]
weight = 12
lines = [
  { by = "initiator", text = "{^cents}. I'd rather not, but I'd rather still not see you go without." },
  { by = "target", text = "I'll make it right." },
]

[[talk]]
id = "borrow_ask_2"
on = ["borrow"]
outcome = "success"
weight = 12
lines = [
  { by = "initiator", text = "I'm ashamed to ask, {you}. Might you lend me {cents}?" },
  { by = "target", text = "I can. And there's no shame in it." },
]

[[talk]]
id = "borrow_harvest"
on = ["borrow"]
outcome = "success"
weight = 4
when = { season = "summer" }
lines = [
  { by = "initiator", text = "Could you spare {cents} until harvest?" },
  { by = "target", text = "Until harvest, then. Mark it on the beam." },
]

[[talk]]
id = "borrow_no_pride"
on = ["borrow"]
outcome = "success"
weight = 12
lines = [
  { by = "initiator", text = "I'd not ask if there were another way." },
  { by = "target", text = "I'd not have you feel you had to. Here." },
]

[[talk]]
id = "borrow_flat_refusal"
on = ["borrow"]
outcome = "failure"
weight = 12
lines = [
  { by = "initiator", text = "Could you spare a little, {you}? Only for the week." },
  { by = "target", text = "The week is what always costs me. No." },
]

[[talk]]
id = "borrow_not_you"
on = ["borrow"]
outcome = "failure"
weight = 8
when = { label = "enemy" }
lines = [
  { by = "initiator", text = "Could you lend me {cents}?" },
  { by = "target", text = "After last time? I think not." },
]

[[talk]]
id = "repay_early"
on = ["repay"]
weight = 12
lines = [
  { by = "initiator", text = "Here's what I owe you, {you}, and a bit extra for the waiting." },
  { by = "target", text = "There's no need. But I'll take it. Thank you." },
]

[[talk]]
id = "repay_counted"
on = ["repay"]
weight = 12
lines = [
  { by = "initiator", text = "{^cents}. Count it." },
  { by = "target", text = "I trust you. ...I'll count it anyway." },
]

[[talk]]
id = "repay_clean"
on = ["repay"]
weight = 12
lines = [
  { by = "initiator", text = "I don't like owing, {you}. It sits in me like a stone." },
  { by = "target", text = "Then it's gone. Be easy." },
]

[[talk]]
id = "repay_friend"
on = ["repay"]
weight = 8
when = { label = "friend" }
lines = [
  { by = "initiator", text = "Here's what I owe you. Don't make a ceremony." },
  { by = "target", text = "A ceremony? I'm putting it in my pocket." },
]

[[talk]]
id = "dun_gently"
on = ["dun"]
outcome = "success"
weight = 12
lines = [
  { by = "initiator", text = "I wouldn't mention it, {you}, but the account is nearly a season old." },
  { by = "target", text = "I know. I've been dreading this." },
]

[[talk]]
id = "dun_sunday"
on = ["dun"]
outcome = "success"
weight = 12
lines = [
  { by = "initiator", text = "{^cents}, {you}. I'll look for it Saturday." },
  { by = "target", text = "Saturday. I'll have it, or a good excuse." },
]

[[talk]]
id = "dun_cold"
on = ["dun"]
outcome = "failure"
weight = 12
lines = [
  { by = "initiator", text = "The account, {you}." },
  { by = "target", text = "It will be paid. I resent being asked." },
]

