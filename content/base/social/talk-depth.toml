# Depth, wave 5 (group D). OWNER: module:social. Read by packages/core/src/social/talk.ts, same rules as talk.toml.
# The lines that fit any day, for the interactions neighbors repeat most (help, chat, prayer, deep talk,
# comfort, compliments, introductions, gossip and asking): seasonal and venue lines only apply some of the
# time, so in any given fortnight this unconditioned pool is what repeats.

# =============================================================================================
# Depth: everyday lines that fit any day, for the interactions neighbors repeat most (wave 5)
# =============================================================================================

# The seasonal and venue lines elsewhere only apply some of the time; in any given fortnight the pool
# that is always eligible is what repeats. These are that pool: plain work, plain talk, plain faith.

[[talk]]
id = "hd_ladder"
on = ["help"]
weight = 12
lines = [
  { by = "initiator", text = "Let me hold the ladder while you see to that shingle." },
  { by = "target", text = "Mind the third rung. It's been promising to break since Michaelmas." },
]

[[talk]]
id = "hd_grindstone"
on = ["help"]
weight = 12
lines = [
  { by = "initiator", text = "I'll turn the grindstone while you sharpen." },
  { by = "target", text = "Steady, now. You turn like a man churning butter." },
]

[[talk]]
id = "hd_horse"
on = ["help"]
weight = 12
lines = [
  { by = "initiator", text = "Here, I'll hold the horse." },
  { by = "target", text = "He bites, but only when he's unsure of you." },
]

[[talk]]
id = "hd_wash_in"
on = ["help"]
weight = 12
lines = [
  { by = "initiator", text = "Shall I bring in the wash before it comes on to rain?" },
  { by = "target", text = "Please. The sky has the look." },
]

[[talk]]
id = "hd_watch_kids"
on = ["help"]
weight = 12
lines = [
  { by = "initiator", text = "I'll watch the children while you finish." },
  { by = "target", text = "Bless you. They'll test you, I warn you." },
]

[[talk]]
id = "hd_bucket"
on = ["help"]
weight = 12
lines = [
  { by = "initiator", text = "Let me carry that bucket." },
  { by = "target", text = "It's mostly slops. Mind your good boots." },
]

[[talk]]
id = "hd_churn"
on = ["help"]
weight = 12
lines = [
  { by = "initiator", text = "I'll take a turn at the churn." },
  { by = "target", text = "Slowly. It's not a race, though my arms think it is." },
]

[[talk]]
id = "hd_peel"
on = ["help"]
weight = 12
lines = [
  { by = "initiator", text = "I'll peel while you talk." },
  { by = "target", text = "Then I'll talk. You'll regret offering." },
]

[[talk]]
id = "hd_wagon"
on = ["help"]
weight = 12
lines = [
  { by = "initiator", text = "Do you need the wagon, {you}? Mine's sitting idle." },
  { by = "target", text = "Till Thursday only. I'll bring it back with a bed of clean straw." },
]

[[talk]]
id = "hd_splice"
on = ["help"]
weight = 12
lines = [
  { by = "initiator", text = "Let me splice that rope for you." },
  { by = "target", text = "A clean splice. Where did you learn that?" },
]

[[talk]]
id = "hd_lantern"
on = ["help"]
weight = 12
lines = [
  { by = "initiator", text = "I'll hold the lantern while you look." },
  { by = "target", text = "A little to the left. There. That's it." },
]

[[talk]]
id = "hd_sit_up"
on = ["help"]
weight = 12
lines = [
  { by = "initiator", text = "I'll sit up with the sick one tonight." },
  { by = "target", text = "I couldn't ask it. ...But thank you." },
]

[[talk]]
id = "hd_table"
on = ["help"]
weight = 12
lines = [
  { by = "initiator", text = "Let me set the table." },
  { by = "target", text = "The forks are in the other drawer. They always are." },
]

[[talk]]
id = "hd_ironing"
on = ["help"]
weight = 12
lines = [
  { by = "initiator", text = "I'll do the ironing, if you'll do the mending." },
  { by = "target", text = "A fair trade. Mine is the worse job, so I'll take it." },
]

[[talk]]
id = "hd_shell_corn"
on = ["help"]
weight = 12
lines = [
  { by = "initiator", text = "I'll shell corn while we talk." },
  { by = "target", text = "The cob pile will be a mountain by supper." },
]

[[talk]]
id = "hd_saw"
on = ["help"]
weight = 12
lines = [
  { by = "initiator", text = "Hand me the other end of that saw." },
  { by = "target", text = "Pull, don't push. The saw knows its job." },
]

[[talk]]
id = "hd_doctor"
on = ["help"]
weight = 12
lines = [
  { by = "initiator", text = "Shall I fetch the doctor, if you like?" },
  { by = "target", text = "Not yet. But I'll remember you offered." },
]

[[talk]]
id = "hd_kindling"
on = ["help"]
weight = 12
lines = [
  { by = "initiator", text = "Shall I split a bit of kindling for you?" },
  { by = "target", text = "Please do. I've been pretending the box was full." },
]

[[talk]]
id = "hd_loaf"
on = ["help"]
weight = 12
lines = [
  { by = "initiator", text = "I'll bring you a loaf tomorrow, {you}." },
  { by = "target", text = "Bring two. The first will be gone by noon." },
]

[[talk]]
id = "hd_porch"
on = ["help"]
weight = 12
lines = [
  { by = "initiator", text = "I'll sweep the porch while you finish up." },
  { by = "target", text = "And I'll put the kettle on for the pair of us." },
]

[[talk]]
id = "hd_yarn"
on = ["help"]
weight = 12
lines = [
  { by = "initiator", text = "Let me wind that yarn." },
  { by = "target", text = "Hold your hands up. And don't tangle it." },
]

[[talk]]
id = "hd_mud_arm"
on = ["help"]
weight = 12
lines = [
  { by = "initiator", text = "Take my arm over the mud, {you}." },
  { by = "target", text = "I'll take it gladly. I've lost one boot already." },
]

[[talk]]
id = "hd_cow_home"
on = ["help"]
weight = 12
lines = [
  { by = "initiator", text = "I'll walk the cow home for you." },
  { by = "target", text = "She'll lead you. Don't argue with her." },
]

[[talk]]
id = "hd_letter"
on = ["help"]
weight = 8
when = { initiator = { trait = "honest" } }
lines = [
  { by = "initiator", text = "I'll write the letter for you, if you like." },
  { by = "target", text = "I'd be glad. I can't get the words to sit still." },
]

[[talk]]
id = "hd_notice"
on = ["help"]
weight = 12
lines = [
  { by = "initiator", text = "Shall I read that notice to you?" },
  { by = "target", text = "Would you? My eyes aren't what they were." },
]

[[talk]]
id = "hd_stove"
on = ["help"]
weight = 12
lines = [
  { by = "initiator", text = "Let me mind the stove while you go." },
  { by = "target", text = "Don't let it go out. And don't let it go hot." },
]

[[talk]]
id = "hd_eggs"
on = ["help"]
weight = 12
lines = [
  { by = "initiator", text = "I'll take your eggs to market, {you}." },
  { by = "target", text = "The speckled ones are the best. Sell those first." },
]

[[talk]]
id = "hd_bellows"
on = ["help"]
weight = 12
lines = [
  { by = "initiator", text = "I'll work the bellows if you'll hammer." },
  { by = "target", text = "Slow and steady. We'll bring the glow up between us." },
]

[[talk]]
id = "hd_scrub"
on = ["help"]
weight = 12
lines = [
  { by = "initiator", text = "Let me scrub the floor." },
  { by = "target", text = "You're a saint. I'll hold the lamp so you can see the dirt." },
]

[[talk]]
id = "hd_baby"
on = ["help"]
weight = 12
lines = [
  { by = "initiator", text = "Give me the baby a minute, {you}. You've been carrying her all morning." },
  { by = "target", text = "A minute. Only a minute. I'll take her back at once." },
]

[[talk]]
id = "hd_wood_shed"
on = ["help"]
weight = 12
lines = [
  { by = "initiator", text = "I'll stack the wood in the shed." },
  { by = "target", text = "Bark side up. It sheds the rain." },
]

[[talk]]
id = "hd_pump"
on = ["help"]
weight = 12
lines = [
  { by = "initiator", text = "I'll pump while you fill." },
  { by = "target", text = "Quick strokes, now. The handle's eager." },
]

[[talk]]
id = "hd_gate_latch"
on = ["help"]
weight = 12
lines = [
  { by = "initiator", text = "That latch needs a nail. Hold the gate." },
  { by = "target", text = "I've held it all week. It's fond of me." },
]

[[talk]]
id = "hd_bread_knead"
on = ["help"]
weight = 12
lines = [
  { by = "initiator", text = "Let me knead for a while." },
  { by = "target", text = "Put your back into it. Bread forgives nothing." },
]

[[talk]]
id = "hd_sew_button"
on = ["help"]
weight = 12
lines = [
  { by = "initiator", text = "Your cuff is hanging by a thread. Give it here." },
  { by = "target", text = "It's been hanging since Christmas. I thought it would hold." },
]

[[talk]]
id = "hd_hoe"
on = ["help"]
weight = 12
lines = [
  { by = "initiator", text = "I'll take the next row with the hoe." },
  { by = "target", text = "Mind the beans. They're thin but they're mine." },
]

[[talk]]
id = "hd_carry_flour"
on = ["help"]
weight = 12
lines = [
  { by = "initiator", text = "Let me shoulder that flour sack." },
  { by = "target", text = "It weighs fifty pounds. I'll walk beside you and pretend I'm not impressed." },
]

[[talk]]
id = "hd_rope_well"
on = ["help"]
weight = 12
lines = [
  { by = "initiator", text = "The well rope's frayed. Let me restring it." },
  { by = "target", text = "Quickly, before it takes the bucket with it." },
]

[[talk]]
id = "hd_dishes"
on = ["help"]
weight = 12
lines = [
  { by = "initiator", text = "I'll wash and you dry." },
  { by = "target", text = "Done. Don't break the blue one. It was my mother's." },
]

[[talk]]
id = "hd_hang_door"
on = ["help"]
weight = 12
lines = [
  { by = "initiator", text = "Hold the door while I set the hinge." },
  { by = "target", text = "Hold it straight. It sags in the middle, like most of us." },
]

[[talk]]
id = "hd_stew_stir"
on = ["help"]
weight = 12
lines = [
  { by = "initiator", text = "I'll stir the pot, {you}. Go and sit." },
  { by = "target", text = "If I sit, I'll sleep. Wake me for supper." },
]

[[talk]]
id = "hd_chicken"
on = ["help"]
weight = 12
lines = [
  { by = "initiator", text = "I'll shut up the hens at dusk." },
  { by = "target", text = "Count them. One has a habit of staying out." },
]

[[talk]]
id = "hd_nails"
on = ["help"]
weight = 12
lines = [
  { by = "initiator", text = "I'll pull the old nails while you saw." },
  { by = "target", text = "Save the straight ones. Nails don't grow on trees." },
]

[[talk]]
id = "hd_rake"
on = ["help"]
weight = 12
lines = [
  { by = "initiator", text = "Give me the rake. I'll finish the yard." },
  { by = "target", text = "Leave the leaves by the fence. They keep the cold off the roses." },
]

[[talk]]
id = "hd_unload"
on = ["help"]
weight = 12
lines = [
  { by = "initiator", text = "Let me help you unload." },
  { by = "target", text = "The heavy crate first. Then we'll see how we feel." },
]

[[talk]]
id = "hd_message"
on = ["help"]
weight = 12
lines = [
  { by = "initiator", text = "I'm passing your brother's place. Shall I take a message?" },
  { by = "target", text = "Tell him I haven't forgotten the plow. And I haven't remembered it either." },
]

[[talk]]
id = "hd_bury_help"
on = ["help"]
weight = 8
when = { mood = "neighborliness" }
lines = [
  { by = "initiator", text = "I'll dig with you. Two spades go faster." },
  { by = "target", text = "It's hard ground. Thank you." },
]

[[talk]]
id = "hd_wrap_up"
on = ["help"]
weight = 4
when = { temp = "freezing" }
lines = [
  { by = "initiator", text = "Wrap yourself up and let me do the outdoor chores." },
  { by = "target", text = "You're a good soul. I'll owe you." },
]

[[talk]]
id = "hd_hot_work"
on = ["help"]
weight = 4
when = { temp = "hot" }
lines = [
  { by = "initiator", text = "Sit in the shade. I'll finish the sunny side." },
  { by = "target", text = "I'll bring you lemonade. If we've lemons." },
]

[[talk]]
id = "cd_cough"
on = ["chat"]
weight = 12
lines = [
  { by = "initiator", text = "How's that cough of yours?" },
  { by = "target", text = "Stubborn. It's moved in and brought its relatives." },
]

[[talk]]
id = "cd_boy"
on = ["chat"]
weight = 12
lines = [
  { by = "initiator", text = "How's the boy, {you}?" },
  { by = "target", text = "Growing out of his shoes faster than I can pay for them." },
]

[[talk]]
id = "cd_girl"
on = ["chat"]
weight = 12
lines = [
  { by = "initiator", text = "And how's your girl?" },
  { by = "target", text = "Reading everything in the house. Including the almanac. Twice." },
]

[[talk]]
id = "cd_sleeping"
on = ["chat"]
weight = 12
lines = [
  { by = "initiator", text = "Did you sleep well, {you}?" },
  { by = "target", text = "Like a man in a boat. Rocking, and unsure of the destination." },
]

[[talk]]
id = "cd_fashion"
on = ["chat"]
weight = 12
lines = [
  { by = "initiator", text = "Have you seen the new bonnets at the store?" },
  { by = "target", text = "I saw one. It looked like a basket with ambitions." },
]

[[talk]]
id = "cd_dog"
on = ["chat"]
weight = 12
lines = [
  { by = "initiator", text = "Your dog's followed me half a mile." },
  { by = "target", text = "He does that. He's collecting people." },
]

[[talk]]
id = "cd_railroad"
on = ["chat"]
weight = 12
lines = [
  { by = "initiator", text = "They say the railroad's coming through the valley." },
  { by = "target", text = "They've been saying that since I arrived. I'll believe it when I hear the whistle." },
]

[[talk]]
id = "cd_plank_road"
on = ["chat"]
weight = 12
lines = [
  { by = "initiator", text = "They're talking of a plank road to the river." },
  { by = "target", text = "Then we'll drown in a better class of mud." },
]

[[talk]]
id = "cd_maine_law"
on = ["chat"]
weight = 12
lines = [
  { by = "initiator", text = "Have you read about the Maine Law?" },
  { by = "target", text = "I have. The men in the tavern read it aloud and drank to its failure." },
]

[[talk]]
id = "cd_kansas"
on = ["chat"]
weight = 12
lines = [
  { by = "initiator", text = "There's talk of trouble in Kansas." },
  { by = "target", text = "I read it twice and still can't get my breakfast down." },
]

[[talk]]
id = "cd_know_nothing"
on = ["chat"]
weight = 12
lines = [
  { by = "initiator", text = "Have you heard about the Know-Nothing lodge?" },
  { by = "target", text = "I've heard of it. I don't mean to know any more." },
]

[[talk]]
id = "cd_cholera"
on = ["chat"]
weight = 12
lines = [
  { by = "initiator", text = "There's cholera in St. Louis, they say." },
  { by = "target", text = "They always say it. I boil my water and mind my prayers." },
]

[[talk]]
id = "cd_steamboat"
on = ["chat"]
weight = 12
lines = [
  { by = "initiator", text = "A steamboat blew her whistle at the landing last night." },
  { by = "target", text = "I heard it. It's the nearest thing to city life we get." },
]

[[talk]]
id = "cd_land_office"
on = ["chat"]
weight = 12
lines = [
  { by = "initiator", text = "Have you been to the land office?" },
  { by = "target", text = "Twice. Both times the clerk was at his dinner." },
]

[[talk]]
id = "cd_new_settlers"
on = ["chat"]
weight = 12
lines = [
  { by = "initiator", text = "There are new settlers taking up the claim by the creek." },
  { by = "target", text = "More the merrier, as long as they bring their own plow." },
]

[[talk]]
id = "cd_mail"
on = ["chat"]
weight = 12
lines = [
  { by = "initiator", text = "Anything in the post for you?" },
  { by = "target", text = "A bill and a tract. The tract's more welcome." },
]

[[talk]]
id = "cd_butter"
on = ["chat"]
weight = 12
lines = [
  { by = "initiator", text = "Is the butter selling?" },
  { by = "target", text = "Slowly. Everybody has butter and nobody has coin." },
]

[[talk]]
id = "cd_hens"
on = ["chat"]
weight = 12
lines = [
  { by = "initiator", text = "How are the hens laying?" },
  { by = "target", text = "Occasionally. They're not committed to the project." },
]

[[talk]]
id = "cd_cow"
on = ["chat"]
weight = 12
lines = [
  { by = "initiator", text = "Is your cow giving well?" },
  { by = "target", text = "Better than my wife expects and worse than I hoped." },
]

[[talk]]
id = "cd_roof"
on = ["chat"]
weight = 12
lines = [
  { by = "initiator", text = "How's your roof?" },
  { by = "target", text = "It lets in the weather. That's about all I can say for it." },
]

[[talk]]
id = "cd_neighbor_wall"
on = ["chat"]
weight = 12
lines = [
  { by = "initiator", text = "Have you seen the new fence next door?" },
  { by = "target", text = "I've seen it. I don't mean to remark on it." },
]

[[talk]]
id = "cd_preacher"
on = ["chat"]
weight = 12
lines = [
  { by = "initiator", text = "Did you hear that preacher from Prairie du Chien?" },
  { by = "target", text = "I did. He preached for three hours, and the cows were quiet for two." },
]

[[talk]]
id = "cd_schoolbook"
on = ["chat"]
weight = 12
lines = [
  { by = "initiator", text = "The children have a new reader." },
  { by = "target", text = "Good. The old one's been read to pieces." },
]

[[talk]]
id = "cd_apple_tree"
on = ["chat"]
weight = 12
lines = [
  { by = "initiator", text = "I put in an apple tree last year. It lived." },
  { by = "target", text = "Then you've done better than most. Mine hasn't spoken to me since." },
]

[[talk]]
id = "cd_old_age"
on = ["chat"]
weight = 12
lines = [
  { by = "initiator", text = "I don't move as quickly as I did." },
  { by = "target", text = "No one does. Even the clock is slower." },
]

[[talk]]
id = "cd_visitors"
on = ["chat"]
weight = 12
lines = [
  { by = "initiator", text = "We had company last night." },
  { by = "target", text = "Pleasant company, or the other kind?" },
  { by = "initiator", text = "The kind that stays till morning." },
]

[[talk]]
id = "cd_prices_tea"
on = ["chat"]
weight = 12
lines = [
  { by = "initiator", text = "Tea's gone dear." },
  { by = "target", text = "Everything's gone dear. Only my wages have stayed put." },
]

[[talk]]
id = "cd_tobacco"
on = ["chat"]
weight = 12
lines = [
  { by = "initiator", text = "Have you tobacco to spare?" },
  { by = "target", text = "Not a pipeful. Ask me after the next wagon." },
]

[[talk]]
id = "cd_clock"
on = ["chat"]
weight = 12
lines = [
  { by = "initiator", text = "What time have you got?" },
  { by = "target", text = "Whatever the sun says. I trust it more than the clock." },
]

[[talk]]
id = "cd_ague"
on = ["chat"]
weight = 12
lines = [
  { by = "initiator", text = "Has anyone been down with the ague?" },
  { by = "target", text = "Half the bottoms. They shake in rhythm." },
]

[[talk]]
id = "cd_corn_price"
on = ["chat"]
weight = 12
lines = [
  { by = "initiator", text = "What's corn fetching at the landing?" },
  { by = "target", text = "Not enough. It never is." },
]

[[talk]]
id = "cd_wool"
on = ["chat"]
weight = 12
lines = [
  { by = "initiator", text = "Is the wool good this year?" },
  { by = "target", text = "Fair. The sheep are cleverer than the shearers." },
]

[[talk]]
id = "cd_trade_wind"
on = ["chat"]
weight = 12
lines = [
  { by = "initiator", text = "Wind's shifted." },
  { by = "target", text = "Then we'll have a change by morning. Or by evening. Or never." },
]

[[talk]]
id = "cd_pension"
on = ["chat"]
weight = 12
lines = [
  { by = "initiator", text = "Do you think the pension will come through?" },
  { by = "target", text = "I've stopped thinking. It saves energy." },
]

[[talk]]
id = "cd_mill_wait"
on = ["chat"]
weight = 12
lines = [
  { by = "initiator", text = "Did you wait long at the mill?" },
  { by = "target", text = "Long enough to count the flies. I got to eleven." },
]

[[talk]]
id = "cd_favorite"
on = ["chat"]
weight = 12
lines = [
  { by = "initiator", text = "What's your favorite hymn, {you}?" },
  { by = "target", text = "Whichever one the organist can actually play." },
]

[[talk]]
id = "cd_candle"
on = ["chat"]
weight = 12
lines = [
  { by = "initiator", text = "I'm running low on candles." },
  { by = "target", text = "Make your own. Tallow's cheap and you can burn the smell." },
]

[[talk]]
id = "cd_grafting"
on = ["chat"]
weight = 12
lines = [
  { by = "initiator", text = "Have you thought of grafting your pear?" },
  { by = "target", text = "Thought of it. It's the doing I've yet to get to." },
]

[[talk]]
id = "cd_strangers_road"
on = ["chat"]
weight = 12
lines = [
  { by = "initiator", text = "There were two strangers on the road this morning." },
  { by = "target", text = "Only two? That's a quiet day." },
]

[[talk]]
id = "cd_blacksmith_gossip"
on = ["chat"]
weight = 12
lines = [
  { by = "initiator", text = "Has the smith been working late again?" },
  { by = "target", text = "Every night. You can hear it from the ford." },
]

[[talk]]
id = "cd_sunday_best"
on = ["chat"]
weight = 12
lines = [
  { by = "initiator", text = "My Sunday coat's gone green at the seams." },
  { by = "target", text = "Green's in fashion. Or it will be, once you've worn it long enough." },
]

[[talk]]
id = "cd_tooth"
on = ["chat"]
weight = 12
lines = [
  { by = "initiator", text = "Have you a remedy for the toothache?" },
  { by = "target", text = "A hot poultice and patience. Mostly patience." },
]

[[talk]]
id = "cd_late_frost"
on = ["chat"]
weight = 12
lines = [
  { by = "initiator", text = "Do you think the frost is done?" },
  { by = "target", text = "Ask me tomorrow. Frost lies." },
]

[[talk]]
id = "cd_old_neighbors"
on = ["chat"]
weight = 12
lines = [
  { by = "initiator", text = "Do you remember when there was only one house in the valley?" },
  { by = "target", text = "I remember when there was none. And I remember complaining about the quiet." },
]

[[talk]]
id = "cd_time_flies"
on = ["chat"]
weight = 12
lines = [
