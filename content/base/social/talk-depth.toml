when = { told = true }
lines = [
  { by = "initiator", text = "You always know, {you}. What is it?" },
  { by = "target", text = "You flatter. But sit down." },
]

[[talk]]
id = "ad_rumor_open"
on = ["ask_about"]
weight = 4
when = { told = true }
lines = [
  { by = "initiator", text = "What's the word?" },
  { by = "target", text = "There's a word. Several. Pick one." },
]

[[talk]]
id = "ad_nothing_2"
on = ["ask_about"]
weight = 4
when = { told = false }
lines = [
  { by = "initiator", text = "What's the word?" },
  { by = "target", text = "Not a one. They're all out for the season." },
]

[[talk]]
id = "ad_nothing_3"
on = ["ask_about"]
weight = 4
when = { told = false }
lines = [
  { by = "initiator", text = "Heard anything, {you}?" },
  { by = "target", text = "Only my own heart. It's quiet." },
]

[[talk]]
id = "ad_nothing_4"
on = ["ask_about"]
weight = 4
when = { told = false }
lines = [
  { by = "initiator", text = "Anything doing?" },
  { by = "target", text = "Nothing but what you see: wind and mud and work." },
]

[[talk]]
id = "wd_take_care"
on = ["warn"]
weight = 4
when = { told = false }
lines = [
  { by = "initiator", text = "Take care on the road, {you}." },
  { by = "target", text = "And you on yours." },
]

[[talk]]
id = "wd_wits"
on = ["warn"]
weight = 4
when = { told = false }
lines = [
  { by = "initiator", text = "Keep your wits about you this week." },
  { by = "target", text = "I've little else to keep." },
]

[[talk]]
id = "wd_things"
on = ["warn"]
weight = 4
when = { told = false }
lines = [
  { by = "initiator", text = "I don't like the look of things." },
  { by = "target", text = "What things?" },
  { by = "initiator", text = "Things in general." },
]

[[talk]]
id = "wd_lock_up"
on = ["warn"]
weight = 4
when = { told = false }
lines = [
  { by = "initiator", text = "Lock up tonight, {you}, and sleep light." },
  { by = "target", text = "I do both. It's the second that's hard." },
]

[[talk]]
id = "wd_feeling"
on = ["warn"]
weight = 4
when = { told = false }
lines = [
  { by = "initiator", text = "There's a strange feeling about, {you}." },
  { by = "target", text = "There's always a strange feeling about. I take it for the weather." },
]

[[talk]]
id = "wd_step"
on = ["warn"]
weight = 4
when = { told = false }
lines = [
  { by = "initiator", text = "Watch your step." },
  { by = "target", text = "I do. It's the others I can't watch." },
]

[[talk]]
id = "wd_wish"
on = ["warn"]
weight = 4
when = { told = false }
lines = [
  { by = "initiator", text = "It's not a warning, only a wish: be careful." },
  { by = "target", text = "Wishes are always welcome." },
]

[[talk]]
id = "wd_keep_from"
on = ["warn"]
weight = 4
when = { told = true }
lines = [
  { by = "initiator", text = "I'd keep this from you if I could, {you}." },
  { by = "target", text = "Then I'm glad you can't." },
]

[[talk]]
id = "wd_not_from_me"
on = ["warn"]
weight = 4
when = { told = true }
lines = [
  { by = "initiator", text = "You didn't hear this from me." },
  { by = "target", text = "Hear what?" },
  { by = "initiator", text = "Exactly." },
]

[[talk]]
id = "wd_stand"
on = ["warn"]
weight = 4
when = { told = true }
lines = [
  { by = "initiator", text = "Stand up, {you}. This isn't for sitting." },
  { by = "target", text = "Now I'm anxious. Out with it." },
]

[[talk]]
id = "wd_listen_close"
on = ["warn"]
weight = 4
when = { told = true }
lines = [
  { by = "initiator", text = "Listen close, {you}." },
  { by = "target", text = "I'm listening. I've both ears." },
]

[[talk]]
id = "gd_none_whisper"
on = ["gossip"]
weight = 4
when = { told = false }
lines = [
  { by = "initiator", text = "Not a whisper, {you}." },
  { by = "target", text = "Then the walls are asleep." },
]

[[talk]]
id = "gd_none_stove"
on = ["gossip"]
weight = 4
when = { told = false }
lines = [
  { by = "initiator", text = "I've heard nothing but the stove." },
  { by = "target", text = "The stove tells no tales." },
]

[[talk]]
id = "gd_none_dry"
on = ["gossip"]
weight = 4
when = { told = false }
lines = [
  { by = "initiator", text = "A dry week for talk." },
  { by = "target", text = "And a wet one for everything else." },
]

[[talk]]
id = "gd_none_sources"
on = ["gossip"]
weight = 4
when = { told = false }
lines = [
  { by = "initiator", text = "My sources have gone quiet." },
  { by = "target", text = "Tell them I'm paying." },
]

[[talk]]
id = "gd_none_would_tell"
on = ["gossip"]
weight = 4
when = { told = false }
lines = [
  { by = "initiator", text = "If I knew anything, I'd tell it." },
  { by = "target", text = "You'd tell it even if you didn't." },
]

[[talk]]
id = "gd_none_bed"
on = ["gossip"]
weight = 4
when = { told = false }
lines = [
  { by = "initiator", text = "The town's gone to bed, {you}." },
  { by = "target", text = "Then the rumors are still up." },
]

[[talk]]
id = "pd_tree"
on = ["pray_with"]
weight = 12
lines = [
  { by = "initiator", text = "He shall be like a tree planted by the rivers of water." },
  { by = "target", text = "That bringeth forth his fruit in his season. Amen." },
]

[[talk]]
id = "pd_words"
on = ["pray_with"]
weight = 12
lines = [
  { by = "initiator", text = "Let the words of my mouth, and the meditation of my heart, be acceptable in thy sight." },
  { by = "target", text = "O Lord, my strength, and my redeemer. Amen." },
]

[[talk]]
id = "pd_valley"
on = ["pray_with"]
weight = 12
lines = [
  { by = "initiator", text = "Yea, though I walk through the valley of the shadow of death." },
  { by = "target", text = "I will fear no evil: for thou art with me." },
]

[[talk]]
id = "pd_light"
on = ["pray_with"]
weight = 12
lines = [
  { by = "initiator", text = "The Lord is my light and my salvation; whom shall I fear?" },
  { by = "target", text = "The Lord is the strength of my life; of whom shall I be afraid?" },
]

[[talk]]
id = "pd_taste"
on = ["pray_with"]
weight = 12
lines = [
  { by = "initiator", text = "O taste and see that the Lord is good." },
  { by = "target", text = "Blessed is the man that trusteth in him. Amen." },
]

[[talk]]
id = "pd_commit"
on = ["pray_with"]
weight = 12
lines = [
  { by = "initiator", text = "Commit thy way unto the Lord; trust also in him." },
  { by = "target", text = "And he shall bring it to pass. Amen." },
]

[[talk]]
id = "pd_clean_heart"
on = ["pray_with"]
weight = 12
lines = [
  { by = "initiator", text = "Create in me a clean heart, O God." },
  { by = "target", text = "And renew a right spirit within me. Amen." },
]

[[talk]]
id = "pd_joyful"
on = ["pray_with"]
weight = 12
lines = [
  { by = "initiator", text = "Make a joyful noise unto the Lord, all ye lands." },
  { by = "target", text = "Serve the Lord with gladness. Amen." },
]

[[talk]]
id = "pd_lamp"
on = ["pray_with"]
weight = 12
lines = [
  { by = "initiator", text = "Thy word is a lamp unto my feet." },
  { by = "target", text = "And a light unto my path. Amen." },
]

[[talk]]
id = "pd_wings"
on = ["pray_with"]
weight = 12
lines = [
  { by = "initiator", text = "If I take the wings of the morning, and dwell in the uttermost parts of the sea." },
  { by = "target", text = "Even there shall thy hand lead me. Amen." },
]

[[talk]]
id = "pd_meat"
on = ["pray_with"]
weight = 12
lines = [
  { by = "initiator", text = "The eyes of all wait upon thee; and thou givest them their meat in due season." },
  { by = "target", text = "Thou openest thine hand, and satisfiest. Amen." },
]

[[talk]]
id = "pd_peace"
on = ["pray_with"]
weight = 12
lines = [
  { by = "initiator", text = "Peace I leave with you, my peace I give unto you." },
  { by = "target", text = "Not as the world giveth. Amen." },
]

[[talk]]
id = "pd_charity"
on = ["pray_with"]
weight = 12
lines = [
  { by = "initiator", text = "And now abideth faith, hope, charity, these three." },
  { by = "target", text = "But the greatest of these is charity. Amen." },
]

[[talk]]
id = "pd_micah"
on = ["pray_with"]
weight = 12
lines = [
  { by = "initiator", text = "What doth the Lord require of thee, but to do justly, and to love mercy." },
  { by = "target", text = "And to walk humbly with thy God. Amen." },
]

[[talk]]
id = "pd_ruth"
on = ["pray_with"]
weight = 8
when = { courting = true }
lines = [
  { by = "initiator", text = "Whither thou goest, I will go." },
  { by = "target", text = "And where thou lodgest, I will lodge. Amen." },
]

[[talk]]
id = "pd_speed"
on = ["pray_with"]
weight = 12
lines = [
  { by = "initiator", text = "O God, make speed to save us." },
  { by = "target", text = "O Lord, make haste to help us. Amen." },
]

[[talk]]
id = "pd_doxology"
on = ["pray_with"]
weight = 12
lines = [
  { by = "initiator", text = "Praise God, from whom all blessings flow." },
  { by = "target", text = "Praise him, all creatures here below. Amen." },
]

[[talk]]
id = "pd_beatitude"
on = ["pray_with"]
weight = 12
lines = [
  { by = "initiator", text = "Blessed are the meek: for they shall inherit the earth." },
  { by = "target", text = "Blessed are the peacemakers. Amen." },
]

[[talk]]
id = "pd_morning_mercy"
on = ["pray_with"]
weight = 4
when = { part = "morning" }
lines = [
  { by = "initiator", text = "Satisfy us early with thy mercy." },
  { by = "target", text = "That we may rejoice and be glad all our days. Amen." },
]

[[talk]]
id = "pd_evening_abide"
on = ["pray_with"]
weight = 4
when = { part = "evening" }
lines = [
  { by = "initiator", text = "Abide with us, for it is toward evening." },
  { by = "target", text = "And the day is far spent. Amen." },
]
