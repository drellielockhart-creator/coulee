# Talk words: a speaker's own idiom (#word# in social/talk.toml). OWNER: module:social.
#
# `words` is how anyone says it; `by_culture` is how someone raised in that culture says it
# (content/base/cultures). Light flavor only: a greeting, a thank-you, an oath, the odd word of
# the old country that a settler would really use. Never dialect spelling, never caricature:
# these people are as sharp as anyone, and most of their talk is plain English.

[[talk_word]]
id = "hello"
words = ["Good day", "Good day to you", "How do"]
by_culture = { yankee = ["How do", "Good day"], norwegian = ["God dag", "Good day"], german = ["Guten Tag", "Grüß Gott", "Good day"], cornish = ["Good day", "Well now"], irish = ["God save you", "Good day to you"], elf_hall = ["Good day", "Well met"] }

