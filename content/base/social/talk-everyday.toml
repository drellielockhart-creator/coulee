# Prayer, help and deep talk, wave 5 (group D). OWNER: module:social. Read by packages/core/src/social/talk.ts,
# same rules as talk.toml. The wave-4 pools for these three were 12, 17 and 10 lines; two weeks of play
# said them hundreds of times. Conditions here: the hour, season and calendar, the venue, the speakers'
# culture and trade and age, their mood, and the relationship.

# =============================================================================================
# Prayer: pray_with (349 exchanges in 14 days came from 12 lines)
# =============================================================================================

# Table graces, psalms and hymns in the speakers' own tradition (KJV, Luther's table prayers, Wesley's
# hymns: all public domain), tied to the hour, the season, the calendar, the mood and the company.
# Kept plain and respectful: these are people at prayer, not a joke.

[[talk]]
id = "pray_morning"
on = ["pray_with"]
weight = 4
when = { part = "morning" }
lines = [
  { by = "initiator", text = "This is the day which the Lord hath made." },
  { by = "target", text = "We will rejoice and be glad in it." },
]

[[talk]]
id = "pray_night"
on = ["pray_with"]
weight = 4
when = { part = "night" }
lines = [
  { by = "initiator", text = "I will both lay me down in peace, and sleep." },
  { by = "target", text = "For thou, Lord, only makest me dwell in safety. Amen." },
]

[[talk]]
id = "pray_spring_season"
on = ["pray_with"]
weight = 4
when = { season = "spring" }
lines = [
  { by = "initiator", text = "To every thing there is a season, and a time to every purpose under the heaven." },
  { by = "target", text = "A time to plant, {you}. Amen." },
]

[[talk]]
id = "pray_summer_hay"
on = ["pray_with"]
weight = 4
when = { season = "summer" }
lines = [
  { by = "initiator", text = "Lord, hold back the rain till the hay is in." },
  { by = "target", text = "And send it after, for the corn. Amen." },
]

[[talk]]
id = "pray_autumn"
on = ["pray_with"]
weight = 4
when = { season = "autumn" }
lines = [
  { by = "initiator", text = "Thou crownest the year with thy goodness, and thy paths drop fatness." },
  { by = "target", text = "Amen. And fill the cellar." },
]

[[talk]]
id = "pray_winter"
on = ["pray_with"]
weight = 4
when = { season = "winter" }
lines = [
  { by = "initiator", text = "Weeping may endure for a night, but joy cometh in the morning." },
  { by = "target", text = "Amen. And the thaw." },
]

[[talk]]
id = "pray_fear"
on = ["pray_with"]
weight = 8
when = { mood = "fear" }
lines = [
  { by = "initiator", text = "God is our refuge and strength, a very present help in trouble." },
  { by = "target", text = "Therefore will we not fear. Amen." },
]

[[talk]]
id = "pray_anxious"
on = ["pray_with"]
weight = 8
when = { mood = "anxious" }
lines = [
  { by = "initiator", text = "Cast all your care upon him, for he careth for you." },
  { by = "target", text = "I'm trying, {you}. Say it again." },
]

[[talk]]
id = "pray_shame"
on = ["pray_with"]
weight = 8
when = { mood = "shame" }
lines = [
  { by = "initiator", text = "If we confess our sins, he is faithful and just to forgive us." },
  { by = "target", text = "Then I'll confess, {you}, and be done carrying it. Amen." },
]

[[talk]]
id = "pray_misfortune_2"
on = ["pray_with"]
weight = 8
when = { misfortune = true }
lines = [
  { by = "initiator", text = "Weep with them that weep. We'll carry something round tomorrow: {misfortune}." },
  { by = "target", text = "And pray tonight. Amen." },
]

[[talk]]
id = "pray_thanks_rain"
on = ["pray_with"]
weight = 4
when = { weather = "rain" }
lines = [
  { by = "initiator", text = "Thank the Lord for the rain, though the roads curse it." },
  { by = "target", text = "He knows best. Amen." },
]

[[talk]]
id = "pray_snow"
on = ["pray_with"]
weight = 4
when = { weather = "snow" }
lines = [
  { by = "initiator", text = "Lord, keep the poor and the travelers from the snow tonight." },
  { by = "target", text = "And the stock in the barns. Amen." },
]

[[talk]]
id = "pray_norwegian_table"
