]

[[talk]]
id = "pray_norwegian_shepherd"
on = ["pray_with"]
weight = 8
when = { initiator = { culture = "norwegian" } }
lines = [
  { by = "initiator", text = "Herren er min hyrde." },
  { by = "target", text = "Meg mangler intet. Amen." },
]

[[talk]]
id = "pray_german_table"
on = ["pray_with"]
weight = 7
when = { initiator = { culture = "german" }, household = true }
lines = [
  { by = "initiator", text = "Komm, Herr Jesu, sei unser Gast." },
  { by = "target", text = "Und segne, was du uns bescheret hast. Amen." },
]

[[talk]]
id = "pray_irish_hail"
