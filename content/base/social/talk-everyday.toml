on = ["help"]
weight = 5
when = { child = true, part = "evening" }
lines = [
  { by = "initiator", text = "I'll hold the lantern for you." },
  { by = "target", text = "Hold it steady. And don't swing it." },
]

[[talk]]
id = "help_kid_kindling"
on = ["help"]
weight = 8
when = { child = true }
lines = [
  { by = "initiator", text = "Do you want kindling, {you}?" },
  { by = "target", text = "Please. Three armloads, and don't drop them on the cat." },
]

[[talk]]
id = "help_neighbor_note"
on = ["help"]
weight = 8
when = { mood = "neighborliness" }
lines = [
  { by = "initiator", text = "It's no trouble. We'll put it down as a neighbor's turn." },
  { by = "target", text = "And the next turn is mine." },
]

# =============================================================================================
# Deep talk: what people tell each other when there is time
# =============================================================================================

[[talk]]
id = "deep_mother"
on = ["deep_talk"]
weight = 12
lines = [
  { by = "initiator", text = "What was your mother like, {you}?" },
  { by = "target", text = "Stubborn, kind, and impossible to argue with. I'm told I take after her." },
]

[[talk]]
id = "deep_stranger_here"
on = ["deep_talk"]
weight = 12
lines = [
  { by = "initiator", text = "Do you ever feel a stranger here?" },
  { by = "target", text = "Every day. Then I look at the others and see that they do too." },
]

[[talk]]
id = "deep_fear"
on = ["deep_talk"]
weight = 12
lines = [
  { by = "initiator", text = "What do you fear most?" },
  { by = "target", text = "Hunger. Not mine: the children's. I wake up with the arithmetic of the flour barrel." },
]

[[talk]]
id = "deep_hundred"
on = ["deep_talk"]
weight = 12
lines = [
  { by = "initiator", text = "What would you do with a hundred dollars?" },
  { by = "target", text = "Clear the note, buy a plow, and then be afraid of the quiet." },
]

[[talk]]
id = "deep_afterlife"
on = ["deep_talk"]
weight = 12
lines = [
  { by = "initiator", text = "Do you believe in an afterlife?" },
  { by = "target", text = "I believe in dinner. The rest I'm still working on." },
]

[[talk]]
id = "deep_regret"
on = ["deep_talk"]
weight = 12
lines = [
  { by = "initiator", text = "Is there anything you'd undo?" },
  { by = "target", text = "A word. An afternoon. A letter I never wrote." },
]

[[talk]]
id = "deep_left_behind"
on = ["deep_talk"]
weight = 12
lines = [
  { by = "initiator", text = "What did you leave behind?" },
  { by = "target", text = "A kitchen, a hill, a mother's grave. I think of the grave most." },
]

[[talk]]
id = "deep_change"
on = ["deep_talk"]
weight = 12
lines = [
  { by = "initiator", text = "Do you think this place will change?" },
  { by = "target", text = "It already has. Last year there wasn't a church." },
]

[[talk]]
id = "deep_happy"
on = ["deep_talk"]
weight = 12
lines = [
  { by = "initiator", text = "Are you happy, {you}?" },
  { by = "target", text = "Not unhappy. It's a quieter thing than I expected." },
]

[[talk]]
id = "deep_doubt"
on = ["deep_talk"]
weight = 12
lines = [
  { by = "initiator", text = "Do you ever doubt, {you}?" },
  { by = "target", text = "Every Tuesday. Then Sunday comes and I'm too busy." },
]

[[talk]]
id = "deep_children"
on = ["deep_talk"]
weight = 12
lines = [
  { by = "initiator", text = "What do you want for your children?" },
  { by = "target", text = "Boots that fit. The rest follows." },
]

[[talk]]
id = "deep_dying"
on = ["deep_talk"]
weight = 12
lines = [
  { by = "initiator", text = "Do you think about dying?" },
  { by = "target", text = "Only when I'm tired, which is always." },
]

[[talk]]
id = "deep_lonely"
on = ["deep_talk"]
weight = 12
lines = [
  { by = "initiator", text = "Do you ever get lonely out here?" },
  { by = "target", text = "Mostly in the evenings. The morning has work to distract me." },
]

[[talk]]
id = "deep_worth"
on = ["deep_talk"]
weight = 12
lines = [
  { by = "initiator", text = "Was it worth coming?" },
  { by = "target", text = "Ask me in twenty years. I'll have a better view of it." },
]

[[talk]]
id = "deep_land"
on = ["deep_talk"]
weight = 12
lines = [
  { by = "initiator", text = "Do you love the land, {you}?" },
  { by = "target", text = "I love what it gives. The land and I have a working arrangement." },
]

[[talk]]
id = "deep_name"
on = ["deep_talk"]
weight = 12
lines = [
  { by = "initiator", text = "Were you named for someone?" },
  { by = "target", text = "For an uncle I never met. By all accounts, I'm a poor copy." },
]

[[talk]]
id = "deep_first_memory"
on = ["deep_talk"]
weight = 12
lines = [
  { by = "initiator", text = "What's your first memory?" },
  { by = "target", text = "A kitchen floor, a warm stove, and a cat with a grudge." },
]

[[talk]]
id = "deep_best_day"
on = ["deep_talk"]
weight = 12
lines = [
  { by = "initiator", text = "What was the best day of your life?" },
  { by = "target", text = "The day the first crop came in. I stood in the field and couldn't believe it was mine." },
]

[[talk]]
id = "deep_hardest"
on = ["deep_talk"]
weight = 12
lines = [
  { by = "initiator", text = "What's been the hardest thing?" },
  { by = "target", text = "Burying someone in ground I'd only just learned to call home." },
]

[[talk]]
id = "deep_winter_night"
on = ["deep_talk"]
weight = 2
when = { season = "winter", part = "night" }
lines = [
  { by = "initiator", text = "Winter nights are long, {you}. What do you think about?" },
  { by = "target", text = "Spring. And whether I'll see it." },
]

[[talk]]
id = "deep_rain_evening"
on = ["deep_talk"]
weight = 2
when = { weather = "rain", part = "evening" }
lines = [
  { by = "initiator", text = "There's nothing like rain on the roof for making a person honest." },
  { by = "target", text = "Then I'll admit I'm afraid of how little I've done." },
]

[[talk]]
id = "deep_summer_porch"
on = ["deep_talk"]
weight = 2
when = { season = "summer", part = "evening" }
lines = [
  { by = "initiator", text = "This is the kind of evening I'd put in a jar." },
  { by = "target", text = "Put me in with it. I'd stay." },
]

[[talk]]
id = "deep_longing_home"
on = ["deep_talk"]
weight = 8
when = { mood = "longing" }
lines = [
  { by = "initiator", text = "I miss the sound of the church bells at home." },
  { by = "target", text = "I miss the sound of my own name said right." },
]

[[talk]]
id = "deep_shame_old"
on = ["deep_talk"]
weight = 8
when = { mood = "shame" }
lines = [
  { by = "initiator", text = "There's a thing I did years ago. I've never told anyone." },
  { by = "target", text = "You needn't now. But if you do, it stays here." },
]

[[talk]]
id = "deep_anxious_2"
on = ["deep_talk"]
weight = 8
when = { mood = "anxious" }
lines = [
  { by = "initiator", text = "I lie awake and count everything that might go wrong." },
  { by = "target", text = "How high do you get?" },
  { by = "initiator", text = "I run out of numbers." },
]

[[talk]]
id = "deep_friend_2"
on = ["deep_talk"]
weight = 8
when = { label = "friend" }
lines = [
  { by = "initiator", text = "I don't say this often, {you}. You've made this place bearable." },
  { by = "target", text = "You've done the same for me, and I've never said so either." },
]

[[talk]]
id = "deep_kin"
on = ["deep_talk"]
weight = 8
when = { kin = true }
lines = [
  { by = "initiator", text = "Do you remember the old house, {you}?" },
  { by = "target", text = "Every stair. Every complaint." },
]

[[talk]]
id = "deep_courting_2"
on = ["deep_talk"]
weight = 8
when = { courting = true }
lines = [
  { by = "initiator", text = "What do you want your life to look like?" },
  { by = "target", text = "A table, a window, a long list of things to do together." },
]

[[talk]]
id = "deep_elder_to_young"
on = ["deep_talk"]
weight = 8
when = { target = { age = "elder" } }
lines = [
  { by = "initiator", text = "What would you tell someone starting out?" },
  { by = "target", text = "Don't buy on credit, and never turn down a drink of water." },
]

[[talk]]
id = "deep_young_to_elder"
on = ["deep_talk"]
weight = 8
when = { target = { age = "young" } }
lines = [
  { by = "initiator", text = "What do you wish someone had told you at my age?" },
  { by = "target", text = "To say what I meant. Most of what I said, I only meant half of." },
]

[[talk]]
id = "deep_norwegian"
on = ["deep_talk"]
weight = 8
when = { initiator = { culture = "norwegian" } }
lines = [
  { by = "initiator", text = "Do you miss the fjord?" },
  { by = "target", text = "Every spring when the snow goes. Here it's mud instead of waterfalls." },
]

[[talk]]
id = "deep_german"
on = ["deep_talk"]
weight = 8
when = { initiator = { culture = "german" } }
lines = [
  { by = "initiator", text = "Do you miss the Rhine?" },
  { by = "target", text = "I miss the air. Here it has no history in it." },
]

[[talk]]
id = "deep_irish"
on = ["deep_talk"]
weight = 8
when = { initiator = { culture = "irish" } }
lines = [
  { by = "initiator", text = "Do you think of Ireland?" },
  { by = "target", text = "Every day. But I think of my children's bread more." },
]

[[talk]]
id = "deep_cornish"
on = ["deep_talk"]
weight = 8
when = { initiator = { culture = "cornish" } }
lines = [
  { by = "initiator", text = "Do you miss the sea, {you}?" },
  { by = "target", text = "I miss the sound of it. Here there's only wind, and it has less to say." },
]

[[talk]]
id = "deep_black_ohio"
on = ["deep_talk"]
weight = 8
when = { initiator = { culture = "black_ohio" } }
lines = [
  { by = "initiator", text = "Do you think we'll be left in peace here?" },
  { by = "target", text = "We've the deed and the school. The rest is up to the neighbors and the Lord." },
]

[[talk]]
id = "deep_yankee"
on = ["deep_talk"]
weight = 8
when = { initiator = { culture = "yankee" } }
lines = [
  { by = "initiator", text = "Do you miss Vermont?" },
  { by = "target", text = "I miss the hills. I don't miss the winters, but then these aren't any better." },
]

[[talk]]
id = "deep_elf_hall"
on = ["deep_talk"]
weight = 8
when = { initiator = { culture = "elf_hall" } }
lines = [
  { by = "initiator", text = "Does it ever weigh on you, being careful all the time?" },
  { by = "target", text = "It weighs. But so does a roof, and I'd not give that up." },
]

[[talk]]
id = "deep_pastor"
on = ["deep_talk"]
weight = 8
when = { target = { occupation = ["pastor", "lay_preacher"] } }
lines = [
  { by = "initiator", text = "Do you ever have days when you don't believe your own sermon?" },
  { by = "target", text = "Most Saturdays. By Sunday I've talked myself back." },
]

[[talk]]
id = "deep_teacher"
on = ["deep_talk"]
weight = 8
when = { target = { occupation = "schoolteacher" } }
lines = [
  { by = "initiator", text = "Do you think they learn anything?" },
  { by = "target", text = "One in ten learns everything. The other nine learn what they need." },
]

[[talk]]
id = "deep_farmer"
on = ["deep_talk"]
weight = 8
when = { target = { occupation = "farmer" } }
lines = [
  { by = "initiator", text = "Do you ever want to give it up?" },
  { by = "target", text = "Every February. Then the thaw comes and I'm a fool again." },
]
