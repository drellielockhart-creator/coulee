weight = 8
when = { initiator = { culture = "irish" } }
lines = [
  { by = "initiator", text = "Hail Mary, full of grace, the Lord is with thee." },
  { by = "target", text = "Holy Mary, Mother of God, pray for us sinners, now and at the hour of our death. Amen." },
]

[[talk]]
id = "pray_irish_company"
