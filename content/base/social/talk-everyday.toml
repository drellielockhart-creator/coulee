weight = 4
when = { observance = "planting" }
lines = [
  { by = "initiator", text = "I'll drop seed behind your plow." },
  { by = "target", text = "Mind the rows. And don't step on the good ground." },
]

[[talk]]
id = "help_harvest_bind"
