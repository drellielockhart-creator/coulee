weight = 5
when = { initiator = { culture = "irish" }, part = "evening" }
lines = [
  { by = "initiator", text = "God and Mary be with you." },
  { by = "target", text = "And Patrick, and the whole company. Amen." },
]

[[talk]]
id = "pray_cornish_tongues"
on = ["pray_with"]
weight = 8
when = { initiator = { culture = "cornish" } }
lines = [
  { by = "initiator", text = "O for a thousand tongues to sing my great Redeemer's praise." },
  { by = "target", text = "The glories of my God and King, the triumphs of his grace." },
]

[[talk]]
id = "pray_cornish_love"
on = ["pray_with"]
weight = 8
when = { initiator = { culture = "cornish" } }
lines = [
  { by = "initiator", text = "And can it be that I should gain an interest in the Savior's blood?" },
  { by = "target", text = "Amazing love! How can it be, that thou, my God, shouldst die for me?" },
]

[[talk]]
id = "pray_amazing_grace"
on = ["pray_with"]
weight = 8
when = { initiator = { culture = ["black_ohio", "yankee"] } }
lines = [
  { by = "initiator", text = "Amazing grace, how sweet the sound." },
  { by = "target", text = "That saved a wretch like me." },
]

[[talk]]
id = "pray_yankee_help"
on = ["pray_with"]
weight = 8
when = { initiator = { culture = "yankee" } }
lines = [
  { by = "initiator", text = "Our help in ages past, Lord, and our hope for years to come." },
  { by = "target", text = "Our shelter from the stormy blast, and our eternal home. Amen." },
]

[[talk]]
id = "pray_elf_hall"
on = ["pray_with"]
weight = 8
when = { initiator = { culture = "elf_hall" } }
lines = [
  { by = "initiator", text = "Salt on the sill, and a bell at the door." },
  { by = "target", text = "And the Word in the house. Amen." },
]

[[talk]]
id = "pray_goblin_pare"
on = ["pray_with"]
weight = 8
when = { initiator = { culture = "goblin_pare" } }
lines = [
  { by = "initiator", text = "Keep the roof, Lord, and the men beneath it." },
  { by = "target", text = "And bring each of them home to the table. Amen." },
]

[[talk]]
id = "pray_church_still"
on = ["pray_with"]
weight = 4
when = { venue = "church" }
lines = [
  { by = "initiator", text = "Let us be still a moment before the Lord." },
  { by = "target", text = "Amen." },
]

[[talk]]
id = "pray_sabbath_evening"
on = ["pray_with"]
weight = 2
when = { sabbath = true, part = "evening" }
lines = [
  { by = "initiator", text = "Another Sabbath, and another week to be forgiven for." },
  { by = "target", text = "Amen. Begin with me." },
]

[[talk]]
id = "pray_courting"
on = ["pray_with"]
weight = 8
when = { courting = true }
lines = [
  { by = "initiator", text = "Bless us both, Lord, and keep us from foolishness." },
  { by = "target", text = "Particularly the second part. Amen." },
]

[[talk]]
id = "pray_friend"
on = ["pray_with"]
weight = 8
when = { label = "friend" }
lines = [
  { by = "initiator", text = "Lord, thank you for friends like this one." },
  { by = "target", text = "Amen. You've been a good one to me." },
]

[[talk]]
id = "pray_people"
on = ["pray_with"]
weight = 8
when = { kin = true }
lines = [
  { by = "initiator", text = "Lord, watch over our people, near and far." },
  { by = "target", text = "Particularly the far ones, who can't watch themselves. Amen." },
]

[[talk]]
id = "pray_harvest"
on = ["pray_with"]
weight = 4
when = { observance = "haying_and_harvest" }
lines = [
  { by = "initiator", text = "Lord of the harvest, bless the hands that bring it in." },
  { by = "target", text = "And the backs that carry it. Amen." },
]

[[talk]]
id = "pray_planting"
on = ["pray_with"]
weight = 4
when = { observance = "planting" }
lines = [
  { by = "initiator", text = "Bless the corn in the hill, Lord, and keep the crows honest." },
  { by = "target", text = "And the cutworms. Amen." },
]

[[talk]]
id = "pray_christmas"
on = ["pray_with"]
weight = 4
when = { observance = "christmas" }
lines = [
  { by = "initiator", text = "Glory to God in the highest, and on earth peace." },
  { by = "target", text = "Good will toward men. Amen." },
]

[[talk]]
id = "pray_easter"
on = ["pray_with"]
weight = 4
when = { observance = "easter_sunday" }
lines = [
  { by = "initiator", text = "He is risen." },
  { by = "target", text = "He is risen indeed." },
]

[[talk]]
id = "pray_good_friday"
on = ["pray_with"]
weight = 4
when = { observance = "good_friday" }
lines = [
  { by = "initiator", text = "It is finished." },
  { by = "target", text = "Lord, have mercy. Amen." },
]

[[talk]]
id = "pray_thanksgiving"
on = ["pray_with"]
weight = 4
when = { observance = "thanksgiving" }
lines = [
  { by = "initiator", text = "O give thanks unto the Lord, for he is good." },
  { by = "target", text = "For his mercy endureth for ever. Amen." },
]

[[talk]]
id = "pray_hungry"
on = ["pray_with"]
weight = 8
when = { mood = "hungry" }
lines = [
  { by = "initiator", text = "Give us this day our daily bread." },
  { by = "target", text = "And a little butter, Lord, if it isn't too much. Amen." },
]

[[talk]]
id = "pray_weary"
on = ["pray_with"]
weight = 8
when = { mood = "weary" }
lines = [
  { by = "initiator", text = "Come unto me, all ye that labour and are heavy laden." },
  { by = "target", text = "And I will give you rest. Amen. Soon." },
]

[[talk]]
id = "pray_temperance"
on = ["pray_with"]
weight = 8
when = { mood = "temperance" }
lines = [
  { by = "initiator", text = "Lead us not into temptation." },
  { by = "target", text = "Or into the tavern after meeting. Amen." },
]

[[talk]]
id = "pray_pastor_asked"
on = ["pray_with"]
weight = 8
when = { target = { occupation = ["pastor", "lay_preacher"] } }
lines = [
  { by = "initiator", text = "Would you offer a prayer for us, {you}?" },
  { by = "target", text = "I would. Almighty God, from whom no secrets are hid, accept our thanks and our trouble. Amen." },
]

[[talk]]
id = "pray_pastor_offers"
on = ["pray_with"]
weight = 8
when = { initiator = { occupation = ["pastor", "lay_preacher"] } }
lines = [
  { by = "initiator", text = "Let us pray. Lord, we are few and the work is long." },
  { by = "target", text = "Give us strength for the day and patience for each other. Amen." },
]

[[talk]]
id = "pray_kid_table"
on = ["pray_with"]
weight = 7
when = { target_child = true, household = true }
lines = [
  { by = "initiator", text = "God is great, God is good, and we thank him for our food." },
  { by = "target", text = "Amen!" },
]

[[talk]]
id = "pray_kid_bless"
on = ["pray_with"]
weight = 8
when = { child = true }
lines = [
  { by = "initiator", text = "God bless Mama and Papa and the cow." },
  { by = "target", text = "And the horse, and the hens. Amen." },
]

[[talk]]
id = "pray_kid_sleep"
on = ["pray_with"]
weight = 5
when = { target_child = true, part = "night" }
lines = [
  { by = "initiator", text = "Matthew, Mark, Luke and John, bless the bed that I lie on." },
  { by = "target", text = "Now sleep, and the angels will mind the rest." },
]

# =============================================================================================
# Help: the work that gets done between neighbors (533 exchanges in 14 days came from 17 lines)
# =============================================================================================

[[talk]]
id = "help_planting"
