# Memory kinds (04 §4.3). OWNER: module:social.
#
# Salience decays daily with integer fixed-point steps (no exp):
#   negative: tau = tau_days × (50 + intensity) × (4 + Rancor) / 200
#   positive: tau = tau_days × (50 + intensity) × (20 + 3·Neighborliness) / 1000
#   neutral:  tau = tau_days × (50 + intensity) / 50
# At intensity 50 and neutral dispositions each works out to 2 × tau_days.
# `floor` is the salience floor at intensity 100, scaled by intensity: a dead child (100)
# never drops below its floor; a petty misfortune (20) keeps a fifth of it.
# `summary` is the gist of a consolidated Summary memory: {other}, {count}, {since}.

[[memory_kind]]
id = "chat"
name = "Small talk"
valence = "positive"
tau_days = 2
summary = "Passed the time with {other} {count} times since {since}"

