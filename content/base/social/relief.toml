# Relief policy (04 §8): finite stores, a reserve for the donor, and obligations.
[[relief_rules]]
id = "poor_relief"
offer_hours = [7]
reserve_days = 4
parcel_days = 2
want_days = 2
want_cash_cents = 100

[[relief_office]]
id = "congregation"
name = "Congregation poor pantry"
