attendance_membership = true
members_only = false
member_relationship = "congregant_with"
pantry_target_days = 7

[[relief_office]]
id = "pare_club"
name = "Club pantry"
role = "accord_speaker"
members_only = true
member_relationship = "neighbor"
pantry_target_days = 7
