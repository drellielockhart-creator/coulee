  { by = "target", text = "Does {source} now. I'll have a word." },
]

[[talk]]
id = "gs_you_calm"
on = ["gossip"]
part = "said"
weight = 5
when = { about = "you", target_mood = "easy" }
lines = [
  { by = "initiator", text = "There's a rumor that {rumor}." },
  { by = "target", text = "It isn't true. I'll say it once, calmly, and then I'll act on it." },
]

[[talk]]
id = "gs_you_shame"
on = ["gossip"]
part = "said"
weight = 5
when = { about = "you", target_mood = "shame" }
lines = [
  { by = "initiator", text = "I heard that {rumor}, {you}." },
  { by = "target", text = "I... don't know what to say to that." },
]

[[talk]]
id = "gs_self_asked"
on = ["gossip"]
part = "said"
weight = 4
when = { about = "self" }
lines = [
  { by = "initiator", text = "You may as well hear it from me: {rumor}." },
  { by = "target", text = "That can't have been easy to say." },
]

[[talk]]
id = "gs_self_guessed"
on = ["gossip"]
part = "said"
weight = 4
when = { about = "self" }
lines = [
  { by = "initiator", text = "It's true what they say: {rumor}." },
  { by = "target", text = "I'd guessed. But thank you for saying it." },
]

[[talk]]
id = "gs_self_safe"
on = ["gossip"]
part = "said"
weight = 5
when = { about = "self", label = "friend" }
lines = [
  { by = "initiator", text = "I'll tell you plainly: {rumor}." },
  { by = "target", text = "It's safe with me." },
]

[[talk]]
id = "gs_self_no_need"
on = ["gossip"]
part = "said"
weight = 4
when = { about = "self" }
lines = [
  { by = "initiator", text = "I'd rather you heard it from me: {rumor}." },
  { by = "target", text = "You needn't have told me. But I'm glad you did." },
]

[[talk]]
id = "gs_self_pastor"
on = ["gossip"]
part = "said"
weight = 5
when = { about = "self", target = { occupation = "pastor" } }
lines = [
  { by = "initiator", text = "Pastor, there's a thing I must say: {rumor}." },
  { by = "target", text = "Say it, and God will hear it with you." },
]

# =============================================================================================
# Asking about the news: the teller is the one asked (the target)
# =============================================================================================

[[talk]]
id = "ask_know_anything"
on = ["ask_about"]
weight = 4
when = { told = true }
lines = [
  { by = "initiator", text = "What do you know, {you}?" },
  { by = "target", text = "More than I should, less than I'd like. Sit down." },
]

[[talk]]
id = "ask_what_say"
on = ["ask_about"]
weight = 4
when = { told = true }
lines = [
  { by = "initiator", text = "What are folk saying?" },
  { by = "target", text = "What they always say. But there's one thing new." },
]

[[talk]]
id = "ask_ear"
on = ["ask_about"]
weight = 4
when = { told = true }
lines = [
  { by = "initiator", text = "You've your ear to the ground, {you}. What's it hearing?" },
  { by = "target", text = "Mostly mud. But there's something." },
]

[[talk]]
id = "ask_store"
on = ["ask_about"]
weight = 2
when = { told = true, venue = "store" }
lines = [
  { by = "initiator", text = "Anything come in with the wagon besides sugar?" },
  { by = "target", text = "News did. Close the door." },
]

[[talk]]
id = "ask_tavern"
on = ["ask_about"]
weight = 2
when = { told = true, venue = "tavern" }
lines = [
  { by = "initiator", text = "What's the talk by the bar tonight?" },
  { by = "target", text = "Lean in, and keep your hat on." },
]

[[talk]]
id = "ask_pastor"
on = ["ask_about"]
weight = 5
when = { told = true, target = { occupation = ["pastor", "lay_preacher"] } }
lines = [
  { by = "initiator", text = "Is there anything I ought to pray about, {you}?" },
  { by = "target", text = "There might be. Come into the vestry." },
]

[[talk]]
id = "ask_printer"
on = ["ask_about"]
weight = 5
when = { told = true, target = { occupation = "editor_printer" } }
lines = [
  { by = "initiator", text = "Anything that didn't make the paper, {you}?" },
  { by = "target", text = "Plenty. That's the best of it." },
]

[[talk]]
id = "ask_gossip"
on = ["ask_about"]
weight = 5
when = { told = true, target = { trait = "gossip" } }
lines = [
  { by = "initiator", text = "{you}! Tell me everything." },
  { by = "target", text = "Oh, I knew you'd ask." },
]

[[talk]]
id = "ask_nobody"
on = ["ask_about"]
weight = 4
when = { told = false }
lines = [
  { by = "initiator", text = "Anything of interest?" },
  { by = "target", text = "Not a word. It's all been said, and said again." },
]

[[talk]]
id = "ask_quiet_week"
on = ["ask_about"]
weight = 2
when = { told = false, season = "summer" }
lines = [
  { by = "initiator", text = "Any news this week?" },
  { by = "target", text = "A very quiet week. The best kind." },
]

[[talk]]
id = "ask_cold_news"
on = ["ask_about"]
weight = 2
when = { told = false, temp = "freezing" }
lines = [
  { by = "initiator", text = "Anything stirring?" },
  { by = "target", text = "Only the stove. It's too cold for news." },
]

[[talk]]
id = "ask_busy"
on = ["ask_about"]
weight = 5
when = { told = false, initiator = { occupation = "farmer" } }
lines = [
  { by = "initiator", text = "I don't suppose you've heard anything?" },
  { by = "target", text = "I've been too busy to hear my own name." },
]

[[talk]]
id = "ask_know_nothing"
on = ["ask_about"]
weight = 5
when = { told = false, label = "acquaintance" }
lines = [
  { by = "initiator", text = "What do you hear, {you}?" },
  { by = "target", text = "Nothing I'd repeat. Ask me something I can answer." },
]

[[talk]]
id = "ask_stranger_cautious"
on = ["ask_about"]
weight = 5
when = { told = false, label = "stranger" }
lines = [
  { by = "initiator", text = "I'm new, and I'd like to know how things stand." },
  { by = "target", text = "I'd tell you if I trusted you. Ask again in a month." },
]

[[talk]]
id = "ask_said_cheerful"
on = ["ask_about"]
part = "said"
weight = 4
when = { about = "other" }
lines = [
  { by = "target", text = "Here's a bit for you: {rumor}." },
  { by = "initiator", text = "Is it so? Well, that's something to chew on." },
]

[[talk]]
id = "ask_said_oddly"
on = ["ask_about"]
part = "said"
weight = 4
when = { about = "other" }
lines = [
  { by = "target", text = "I'll tell you what I heard, and you may do with it what you like: {rumor}." },
  { by = "initiator", text = "I'll do nothing at all. But I'll think about it." },
]

[[talk]]
id = "ask_said_doubts_2"
on = ["ask_about"]
part = "said"
weight = 2
when = { heard = "doubts", about = "other" }
lines = [
  { by = "target", text = "{^hedge} {rumor}." },
  { by = "initiator", text = "That's a lot of weight on a thin string." },
]

[[talk]]
id = "ask_said_doubts_3"
on = ["ask_about"]
part = "said"
weight = 2
when = { heard = "doubts", about = "other" }
lines = [
  { by = "target", text = "{^hedge} {rumor}." },
  { by = "initiator", text = "I'll ask around before I believe a word of it." },
]

[[talk]]
id = "ask_said_credits_2"
on = ["ask_about"]
part = "said"
weight = 2
when = { heard = "credits", about = "other" }
lines = [
  { by = "target", text = "{^hedge} {rumor}." },
  { by = "initiator", text = "I'd wondered. Thank you for telling me plainly." },
]

[[talk]]
id = "ask_said_credits_3"
on = ["ask_about"]
part = "said"
weight = 2
when = { heard = "credits", about = "other" }
lines = [
  { by = "target", text = "{^hedge} {rumor}." },
  { by = "initiator", text = "Then I'll know to be careful. Much obliged." },
]

[[talk]]
id = "ask_said_already_2"
on = ["ask_about"]
part = "said"
weight = 2
when = { heard = "already", about = "other" }
lines = [
  { by = "target", text = "It's no secret: {rumor}." },
  { by = "initiator", text = "No, it's not. I just wanted to hear how you'd tell it." },
]

[[talk]]
id = "ask_said_uncanny_2"
on = ["ask_about"]
part = "said"
weight = 2
when = { rumor = "uncanny", about = "other" }
lines = [
  { by = "target", text = "{^hedge} {rumor}. Keep your lamp lit." },
  { by = "initiator", text = "I always do. It's a habit I've never regretted." },
]

[[talk]]
id = "ask_said_scandal_2"
on = ["ask_about"]
part = "said"
weight = 2
when = { rumor = "scandal", about = "other" }
lines = [
  { by = "target", text = "{^hedge} {rumor}. Mind you don't say I told you." },
  { by = "initiator", text = "I never heard a word from you. I'll swear to it." },
]

[[talk]]
id = "ask_said_kind_2"
on = ["ask_about"]
part = "said"
weight = 2
when = { rumor = "kind", about = "other" }
lines = [
  { by = "target", text = "{^hedge} {rumor}. A bit of good news." },
  { by = "initiator", text = "There's so little going about. Thank you." },
]

[[talk]]
id = "ask_said_you_2"
on = ["ask_about"]
part = "said"
weight = 4
when = { about = "you" }
lines = [
  { by = "target", text = "You asked, so: folk say {rumor}." },
  { by = "initiator", text = "Do they. I'd sooner they said it to me." },
]

[[talk]]
id = "ask_said_self_2"
on = ["ask_about"]
part = "said"
weight = 4
when = { about = "self" }
lines = [
  { by = "target", text = "I'd as soon you heard it from me: {rumor}." },
  { by = "initiator", text = "I'm glad I asked, then." },
]

# =============================================================================================
# Confiding and warning, said
# =============================================================================================

[[talk]]
id = "confide_hush"
on = ["confide"]
weight = 4
when = { told = true }
lines = [
  { by = "initiator", text = "Keep your voice down, {you}. What I'm going to say can't be taken back." },
  { by = "target", text = "I'm listening. Say it." },
]

[[talk]]
id = "confide_hard"
on = ["confide"]
weight = 4
when = { told = true }
lines = [
  { by = "initiator", text = "It's a hard thing to say aloud, {you}." },
  { by = "target", text = "Then say it slowly. I've got time." },
]

[[talk]]
id = "confide_truth"
on = ["confide"]
weight = 5
when = { told = true, label = "friend" }
lines = [
  { by = "initiator", text = "I've never told this to anyone. I hope I'm not a fool to tell it to you." },
  { by = "target", text = "You're not. Go on." },
]

[[talk]]
id = "confide_pastor"
on = ["confide"]
weight = 5
when = { told = true, target = { occupation = "pastor" } }
lines = [
  { by = "initiator", text = "Pastor, may I speak to you in confidence?" },
  { by = "target", text = "Always. The vestry's empty." },
]

[[talk]]
id = "confide_night"
on = ["confide"]
weight = 2
when = { told = true, part = "night" }
lines = [
  { by = "initiator", text = "I can't sleep, {you}, for thinking of it." },
  { by = "target", text = "Then tell me. Two heads on a pillow are better than one." },
]

[[talk]]
id = "confide_nothing_2"
on = ["confide"]
weight = 4
when = { told = false }
lines = [
  { by = "initiator", text = "I wanted to say something, {you}, and now I can't find it." },
  { by = "target", text = "It'll come back. Sit with me till it does." },
]

[[talk]]
id = "confide_nothing_3"
on = ["confide"]
weight = 5
when = { told = false, mood = "anxious" }
lines = [
  { by = "initiator", text = "Sometimes I want to tell someone everything, and there's no everything to tell." },
  { by = "target", text = "That's the commonest burden. Sit down." },
]

[[talk]]
id = "confide_said_other_2"
on = ["confide"]
part = "said"
weight = 4
when = { about = "other" }
lines = [
  { by = "initiator", text = "I've held this long enough: {rumor}." },
  { by = "target", text = "It'll stay with me." },
]

[[talk]]
id = "confide_said_self_2"
on = ["confide"]
part = "said"
weight = 4
when = { about = "self" }
lines = [
  { by = "initiator", text = "{^rumor}. There. I've said it." },
  { by = "target", text = "Thank you for trusting me with it." },
]

[[talk]]
id = "confide_said_you_2"
on = ["confide"]
part = "said"
weight = 2
when = { about = "you", heard = "doubts" }
lines = [
  { by = "initiator", text = "They say {rumor}, {you}, and I wanted you to know I don't believe it." },
  { by = "target", text = "I'm grateful. Truly." },
]

[[talk]]
id = "warn_said_sure"
on = ["warn"]
part = "said"
weight = 4
when = { about = "other" }
lines = [
  { by = "initiator", text = "{^hedge} {rumor}. Be careful." },
  { by = "target", text = "I'll be careful, and I'll be grateful." },
]

[[talk]]
id = "warn_said_lamp"
on = ["warn"]
part = "said"
weight = 2
when = { about = "other", part = "evening" }
lines = [
  { by = "initiator", text = "{^hedge} {rumor}. Keep a lamp lit tonight." },
  { by = "target", text = "I always do." },
]

[[talk]]
id = "warn_said_door"
on = ["warn"]
part = "said"
weight = 2
when = { about = "other", heard = "already" }
lines = [
  { by = "initiator", text = "{^hedge} {rumor}. Bar the door." },
  { by = "target", text = "It's been barred since September." },
]

[[talk]]
id = "warn_said_roads"
on = ["warn"]
part = "said"
weight = 2
when = { about = "other", weather = "rain" }
lines = [
  { by = "initiator", text = "{^hedge} {rumor}. Stay off the low road." },
  { by = "target", text = "The low road and I have an understanding already." },
]

[[talk]]
id = "warn_said_ask"
on = ["warn"]
part = "said"
weight = 2
when = { about = "other", secondhand = false }
lines = [
  { by = "initiator", text = "{^hedge} {rumor}." },
  { by = "target", text = "Why are you telling me?" },
  { by = "initiator", text = "Because you'd do the same for me." },
]

[[talk]]
id = "warn_said_doubts_2"
on = ["warn"]
part = "said"
weight = 2
when = { about = "other", heard = "doubts" }
lines = [
  { by = "initiator", text = "{^hedge} {rumor}. I thought you should know." },
  { by = "target", text = "I'll take it under advisement, as the lawyers say." },
]

[[talk]]
id = "warn_said_credit_2"
on = ["warn"]
part = "said"
weight = 2
when = { about = "other", heard = "credits" }
lines = [
  { by = "initiator", text = "{^hedge} {rumor}. Mind yourself." },
  { by = "target", text = "I will. I'd rather be careful than be a fool." },
]
