# News, wave 5 (group D). OWNER: module:social. Read by packages/core/src/social/talk.ts, same rules as talk.toml.
#
# The `said` lines here carry the rumor itself and go on the private belief.transmitted event. A hearer
# answers according to their own belief (`heard`: credits / doubts / already), the kind of news (`rumor`),
# whom it is about (`about`), and who they are (`target = { culture/occupation/trait }`, `target_mood`),
# which is why a character who is asked the same thing twice does not give the same answer twice
# (playtest r2: the player's character answered every rumor 'I'd want more than talk before I'd credit that').

# =============================================================================================
# Gossip, asking, confiding and warning: the act (what witnesses overhear: never the news itself)
# =============================================================================================

[[talk]]
id = "gossip_sit_down"
on = ["gossip"]
weight = 4
when = { told = true }
lines = [
  { by = "initiator", text = "Sit down, {you}. You'll want to for this." },
  { by = "target", text = "Now I'm worried. Go on." },
]

[[talk]]
id = "gossip_dont_repeat"
on = ["gossip"]
weight = 4
when = { told = true }
lines = [
  { by = "initiator", text = "Don't repeat this, {you}." },
  { by = "target", text = "When have I ever?" },
  { by = "initiator", text = "Every time. But I tell you anyway." },
]

[[talk]]
id = "gossip_between_us"
on = ["gossip"]
weight = 5
when = { told = true, label = "friend" }
lines = [
  { by = "initiator", text = "This is between us, {you}." },
  { by = "target", text = "Then it'll go no further than the next person I see." },
]

[[talk]]
id = "gossip_strangers"
on = ["gossip"]
weight = 5
when = { told = true, label = "stranger" }
lines = [
  { by = "initiator", text = "You're new, {you}, so you may as well hear how things stand." },
  { by = "target", text = "I'd be glad of it." },
]

[[talk]]
