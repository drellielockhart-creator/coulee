# Iron Ford site and places (01 §8.2). OWNER: module:content-world.
# Grid is in tiles (tile_ft feet each), origin top-left; x grows east, y grows south.
# Hasp Creek runs north -> south at x=32; the single street (x=26) runs beside it; the iron ford is
# where the street's road crosses the creek (y=14) and the Ridge road climbs east. Lantern Coulee
# comes down from the north-west (upper coulee, Huldra's Shelf, the Cold Stair), the bluffs frame
# west and east, the river bottoms and ferry landing are at the bottom (south).
# Penhallow Diggings and the Kvale Ridge farms are drawn at the east edge so the first scenario
# is playable on one map; worldgen templates (ADR 0003) will split them into their own sites.
# MODEL IDS used (for module:assets): mill, smithy, store, tavern, church, cabin, house, print_shop,
# schoolhouse, landing, barn, farmstead, ford. Places without `model` render as boxes.

[[site]]
id = "iron_ford"
name = "Iron Ford"
landmarks = { main_street = "Main Street", back_road = "Ridge Road", creek = "Hasp Creek" }
description = "A mill village of about 260 at the mouth of Lantern Coulee, where Hasp Creek drops into the river bottoms."
