# Fae charms (13 §5): the TRUE function of a charm item. The BELIEVED function lives only in
# beliefs: each claim compiles at bundle time to the predicate `claim.<item>.<claim>(item)`, and
# each from/route edge to the parent's rumor mutation link (13 §5.3). Slice 1b ships two.

[[charm]]
id = "never_empty_sack"
item = "never_empty_sack"
called = "the moonsilk flour sack"
saying = "Tie it shut at night and don't look in till the cock crows."
court = "hearth"
tier = 2
minimum_fi = 0
harm_basis = "instrument"
virtue = { max = 7, start = 4 }
activation = { kind = "tied_overnight", dark = true }
recharge = [
  { kind = "offering", items = [{ def = "cornmeal", qty = 1 }, { def = "butter", qty = 1 }], where = "keeper_hearth", amount = 7, cooldown_minutes = 10080 },
]
effects = [
  { kind = "draw", defs = ["flour"], qty = 10, at = "dawn", virtue = 1, radius_mi = 3, from = ["store", "mill", "club_pantry", "household"], ward_g = 908, trace = "a dusting of flour on the sill, and the bin lower than it was" },
]
iron = { contact = "suppress", nearby_g = 908, sour_per_day = 2, recharge_floor = 25 }
quirks = ["unthanked"]
allure = 70
failure = "No source in reach, no room in the sack or no virtue left: nothing moves and no virtue is spent."
value_cents = 4000
claims = [
  { id = "feeds", group = "output", text = "{0} keeps a family in bread", weight = 40, juiciness = 55, valence = 20 },
  { id = "never_empty", group = "output", text = "{0} never comes up empty", weight = 60, from = "feeds", route = "exaggerates", juiciness = 55, valence = 20 },
  { id = "from_nothing", group = "output", text = "{0} makes flour out of nothing", weight = 80, from = "never_empty", route = "exaggerates", juiciness = 65, valence = 15 },
  { id = "gold", group = "output", text = "{0} fills with gold for the right hand", weight = 95, from = "from_nothing", route = "exaggerates", juiciness = 75, valence = 10 },
  { id = "devils", group = "danger", text = "{0} is the Devil's own sack", weight = 50, from = "from_nothing", route = "supernaturalizes", juiciness = 70, valence = -40 },
  { id = "steals", group = "danger", text = "{0} steals flour from other people's bins", weight = 30, route = "truth", juiciness = 70, valence = -50 },
]

