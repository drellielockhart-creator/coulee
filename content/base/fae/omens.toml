fi_min = 2
fi_max = 5
tags = ["goat_prairie"]
notice_dc = 8
thins = 15
text = ["A cow-bell sounds upslope, though nobody grazes stock here.", "Bells move through the bluestem without bending it.", "A little herd of bells passes below the ledge; no cattle follow."]
plain = ["A grazing bell carries from the far ridge.", "A neighbor's harness jingles along the lower track."]
signature = "A cow-bell sounds somewhere beyond the empty ledges."
reading = "Bells on ungrazed prairie: huldre cattle. Do not follow them."
counter = "The iron-shod survey post stands silent; the bells keep away."

