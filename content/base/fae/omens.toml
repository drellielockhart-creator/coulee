tags = ["goat_prairie"]
notice_dc = 8
duration_minutes = 360
thins = 15
text = ["A cow-bell sounds upslope, though nobody grazes stock here.", "Bells move through the bluestem without bending it.", "A little herd of bells passes below the ledge; no cattle follow.", "One dull bell answers another from the empty grass.", "A thin chime rises from the ledge and stops short.", "Three uneven notes drift over the pasqueflower.", "A bell gives a single stroke beneath the limestone lip.", "Something jingles beyond the survey post, out of sight."]
plain = ["A grazing bell carries from the far ridge.", "A neighbor's harness jingles along the lower track.", "Sound from cattle beyond the ridge has carried across the hollow.", "Two farms keep belled stock on opposite slopes.", "A loose buckle strikes a carrier's tin cup below.", "Harness bells carry from a team on the ridge road.", "A distant bell echoes from the limestone face.", "A tether chain rattles in a pasture beyond the rise."]
signature = "A cow-bell sounds somewhere beyond the empty ledges."
reading = "Bells on ungrazed prairie: huldre cattle. Do not follow them."
counter = "The iron-shod survey post stands silent; the bells keep away."

[[omen]]
id = "ice"
