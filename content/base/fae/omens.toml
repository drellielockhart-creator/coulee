fi_min = 1
fi_max = 5
notice_dc = 8
thins = 5
tags = ["home", "farm", "store", "mill"]
text = ["The porridge bowl is licked clean on the outside.", "A neat plait has appeared in the loose straw by the door.", "Three tools lie with their handles pointing to the threshold."]
plain = ["Small claw marks betray the pantry visitor.", "The straw has caught on a bent nail.", "Someone set the tools down here."]
