fi_max = 5
tags = ["algific"]
notice_dc = 6
duration_minutes = 360
thins = -20
text = ["Frost has sorted the fallen leaves into narrow ranks.", "The boulder is rimed white; every bird nearby has fallen silent.", "Cold breath rises from the talus against the warmer wind.", "A white seam crosses the moss beneath the ledge.", "The stones sweat cold water while the grass stands dry.", "A rim of ice holds the fallen twig quite straight.", "The hollow smells of snow though the path is bare.", "A thin white crust marks every shaded stone."]
plain = ["Cold air follows the grooves between the stones.", "Old ice beneath the talus chills this sheltered hollow.", "Cold air drains from a crevice in the algific slope.", "Seeping water has frozen along a shaded joint.", "Warm damp air condenses against the cold rock.", "A trickle has frozen around the twig in the shade.", "Air from old ice escapes beneath the loose stones.", "A pocket of cold air has settled below the talus."]
signature = "Cold air wells between the talus stones."
reading = "Ice keeps its own law here. The wandering folk avoid this stair."
counter = "The cold stone offers a refuge from wandering lights."
