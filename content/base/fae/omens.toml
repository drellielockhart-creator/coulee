family = "lights"
fi_min = 2
fi_max = 4
notice_dc = 12
thins = 15
subtle = true
text = ["Lights in the bottoms, low, keeping pace with nothing.", "A pale light slips between two trunks and leaves no shadow.", "Under the hazels, three low lights turn together."]
plain = ["Fox fire shines in the rotting wood.", "A lantern on the ridge shines through the brush.", "Marsh gas burns low over the wet ground."]
signature = "A pale glimmer rests where the bank hides the sky."
reading = "These lights hold their distance like guests waiting to be invited."
counter = "Do not follow a light across running water."

