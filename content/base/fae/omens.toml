tag_weights = { coulee = 1500 }
weight = 100
glamour = true
fi_min = 2
fi_max = 4
notice_dc = 12
duration_minutes = 360
thins = 15
subtle = true
text = ["Lights in the bottoms, low, keeping pace with nothing.", "A pale light slips between two trunks and leaves no shadow.", "Under the hazels, three low lights turn together.", "A green glimmer lies along a fallen branch.", "Two pinpricks shine below the bank, then one.", "A yellow gleam travels across the reeds without a footfall.", "A whitish spark holds at the root of the willow.", "Little lights lie in a row beneath the deadfall."]
plain = ["Fox fire shines in the rotting wood.", "A lantern on the ridge shines through the brush.", "Marsh gas burns low over the wet ground.", "Fungus gives the damp wood its pale light.", "A small animal turns its eyes away from the sky.", "A distant lantern shows between the reed stems.", "A wet stone at the root catches the last daylight.", "Several patches of rotten wood give off fox fire."]
signature = "A pale glimmer rests where the bank hides the sky."
reading = "These lights hold their distance like guests waiting to be invited."
counter = "Do not follow a light across running water."

[[omen]]
id = "echo"
family = "echo"
weight = 100
deep_sense = true
sight = false
fi_min = 2
fi_max = 5
tags = ["bluff", "cave", "mine"]
notice_dc = 10
duration_minutes = 360
thins = 10
text = ["The echo answers before the call has ended.", "A second footfall sounds from inside the ledge.", "Three taps come from the stone after the last hammer-stroke.", "A breath whistles through the face of the rock.", "Water sounds behind the dry face of the bluff.", "A low note follows the scrape of a boot.", "Gravel rattles twice where only one stone fell.", "A clipped word comes back from under the overhang."]
plain = ["Two rock faces throw the sound back at different times.", "Loose stone falls in the cleft.", "The blow has loosened chips inside a crack.", "Air passes through a narrow joint in the stone.", "A hidden seep falls into a hollow beneath the ledge.", "The hollow rock carries a sound from farther down the slope.", "The stone struck two shelves on its way down.", "The overhang has caught the end of a distant shout."]
signature = "The ledge returns a footstep from an awkward direction."
reading = "An answering echo: someone under the stone is listening."
counter = "Give no name to an answering rock."

