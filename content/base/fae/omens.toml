thins = 0
text = ["A small bird beats at the inside of the window.", "A picture tilts on its nail though the room is still.", "The death-watch ticks twice behind the wainscot.", "A candle gutters beside the closed door.", "The clock stops with its hands together.", "A swallow strikes the pane and wheels away.", "A spoon rings against a cup on the empty table.", "A little soot falls into the clean grate."]
plain = ["A bird has mistaken the window for sky.", "The nail is loose in the plaster.", "A beetle is tapping in the dry timber.", "A draught comes beneath the ill-fitted sill.", "The clock weight has reached the floor.", "The pane reflects the open yard.", "The table rocks on an uneven board.", "A gust has shaken soot from the chimney."]
signature = "A worn threshold catches the light."
reading = "People call such household accidents portents; this is no proof."
counter = "A latch and a sound nail answer this sign."

[[omen]]
id = "hearth"
family = "hearth"
weight = 100
glamour = true
fi_min = 1
fi_max = 5
notice_dc = 8
duration_minutes = 360
thins = 5
tags = ["home", "farm", "store", "mill"]
text = ["The porridge bowl is licked clean on the outside.", "A neat plait has appeared in the loose straw by the door.", "Three tools lie with their handles pointing to the threshold.", "Flour on the sill bears five narrow marks, all pointing inward.", "The cream saucer stands beneath the bench, quite dry.", "The kindling is laid crosswise, smallest stick uppermost.", "A loop of red thread hangs from the pantry latch.", "The broom leans bristles upward against the shut door."]
plain = ["Small claw marks betray the pantry visitor.", "The straw has caught on a bent nail.", "Someone set the tools down here.", "A mouse has dragged its toes through the flour.", "A cat has pushed the saucer out of reach.", "Someone has sorted the dry wood for the morning fire.", "A sleeve has snagged on the latch.", "Someone propped the damp broom up to dry."]
signature = "Ash gathers on the wrong side of the hearthstone."
reading = "A hearth guest has been attending to the threshold."
counter = "Iron at a threshold keeps small visitors out."

[[omen]]
