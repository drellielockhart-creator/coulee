# Activities (T1 abstracted blocks, one game-hour at a time). OWNER: module:needs-activities.
#
# Occupation schedules (content/base/occupations, content-world) and the human calendar
# (calendar.toml here) reference these ids. Never rename one; add a new id instead.
#
# `needs` are deltas per hour (positive satisfies). Costs of living come from `labor`:
# heavy labor burns hunger/thirst/rest faster (needs.toml labor_pct).
# Tags the sim reads: labor (stops on the Sabbath), essential (stock must still be fed),
# meal, cook, commerce (a shopping hour), worship, school, leisure, chore, travel.
# `yields`/`tool`/`check` are real production: the goods land in the household's stores or the
# actor's kit. Items marked `optional` are ignored if content/base/items doesn't carry them.

# ---- Basic life --------------------------------------------------------------------------

