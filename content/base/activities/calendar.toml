# ---- Market, mail and court ---------------------------------------------------------------

[[observance]]
id = "market_day"
name = "Market day"
description = "Saturday: farm families come in; the town's population nearly doubles; prices and rumors peak."
when = { weekdays = ["sat"] }
announce = true
blocks = [
  { from = 9, to = 14, activity = "go_to_market", fallback = "idle_at_home", priority = 35, duty = 450, announce = true, who = { home_kinds = ["farmstead"], min_age = 12, not_workplace_tags = ["store", "smithy", "mill", "tavern", "church", "school"] }, attend = { base_pct = 80, value_pct = { neighborliness = 5, thrift = 3 }, weather_pct = [{ below_f = 32, pct = 50, label = "Snowbound roads" }, { below_f = 20, pct = 25, label = "Bitter cold" }] } },
  { from = 9, to = 14, activity = "go_to_market", fallback = "idle_at_home", priority = 35, duty = 350, who = { not_home_kinds = ["farmstead"], min_age = 12, not_workplace_tags = ["store", "smithy", "mill", "tavern", "church", "school"] }, attend = { base_pct = 40, value_pct = { neighborliness = 6, thrift = 4 }, trait_pct = { gossip = 15 }, weather_pct = [{ below_f = 32, pct = 50, label = "Snowbound roads" }, { below_f = 20, pct = 25, label = "Bitter cold" }] } },
]

[[observance]]
id = "mail_days"
name = "Mail day"
description = "The stage comes twice a week: letters, newspapers, news from outside."
when = { weekdays = ["tue", "fri"] }
blocks = [
  { from = 11, to = 13, activity = "fetch_mail", fallback = "idle_at_home", priority = 25, duty = 300, who = { min_age = 12 }, attend = { base_pct = 30, value_pct = { neighborliness = 4, ambition = 4 }, trait_pct = { gossip = 10 } } },
]

[[observance]]
id = "court_day"
name = "Court day"
description = "The first Monday: the justice sits at the tavern. Land disputes, slander, debts, a crowd."
when = { weekdays = ["mon"], day_range = [1, 7] }
announce = true
blocks = [
  { from = 10, to = 15, activity = "hold_court", priority = 65, duty = 800, who = { roles = ["jp"] } },
  { from = 10, to = 15, activity = "attend_court", fallback = "idle_at_home", priority = 30, duty = 350, who = { min_age = 16, not_roles = ["jp"], not_workplace_tags = ["store", "smithy", "mill"] }, attend = { base_pct = 12, value_pct = { neighborliness = 4, rancor = 3 }, trait_pct = { gossip = 15 } } },
]

# ---- The farm year ---------------------------------------------------------------------

[[observance]]
id = "sugaring"
name = "Sugaring-off"
description = "March-April: the thaw runs the sap. Kettles boil day and night in the sugar bush."
when = { months = [3, 4], weekdays = ["mon", "tue", "wed", "thu", "fri", "sat"] }
blocks = [
  { from = 8, to = 16, activity = "tap_maples", fallback = "tend_stock", priority = 28, duty = 600, who = { home_kinds = ["farmstead"], min_age = 10 }, attend = { base_pct = 70 } },
]

[[observance]]
id = "planting"
name = "Planting"
description = "April-May: wheat, oats and corn go in as soon as the ground can be worked."
when = { months = [4, 5, 6], weekdays = ["mon", "tue", "wed", "thu", "fri", "sat"] }
blocks = [
  { from_sun = { anchor = "sunrise", offset_h = 0 }, to_sun = { anchor = "sunset", offset_h = 0 }, from = 6, to = 18, activity = "plow_and_plant", fallback = "tend_stock", priority = 30, duty = 650, who = { home_kinds = ["farmstead"], min_age = 12 }, attend = { base_pct = 90 } },
]

[[observance]]
id = "haying_and_harvest"
name = "Haying and harvest"
description = "June-October: all hands, from first light to dark. Wages are up; hired labor is wanted."
when = { months = [6, 7, 8, 9, 10], weekdays = ["mon", "tue", "wed", "thu", "fri", "sat"] }
blocks = [
  { from_sun = { anchor = "sunrise", offset_h = 0 }, to_sun = { anchor = "sunset", offset_h = 0 }, from = 5, to = 19, activity = "bring_in_crops", fallback = "tend_stock", priority = 30, duty = 700, who = { home_kinds = ["farmstead"], min_age = 12 }, attend = { base_pct = 92 } },
]

[[observance]]
id = "threshing"
name = "Threshing"
description = "September-October: the machine comes round, and every neighbor lends a hand."
when = { months = [9, 10], weekdays = ["mon", "tue", "wed", "thu", "fri", "sat"] }
blocks = [
  { from = 7, to = 18, activity = "thresh_grain", fallback = "bring_in_crops", priority = 31, duty = 700, who = { home_kinds = ["farmstead"], min_age = 14 }, attend = { base_pct = 60 } },
]

[[observance]]
id = "hog_killing"
name = "Hog-killing week"
description = "The first hard frost: every household with a pig puts down its winter meat."
when = { months = [11], day_range = [8, 16], weekdays = ["mon", "tue", "wed", "thu", "fri", "sat"] }
announce = true
blocks = [
  { from = 7, to = 17, activity = "butcher_hogs", fallback = "keep_house", priority = 44, duty = 700, who = { min_age = 12 }, attend = { base_pct = 55, value_pct = { thrift = 6 } } },
]

[[observance]]
id = "ice_harvest"
name = "Ice harvest"
description = "January-February: saws on the river; the icehouse fills for next summer."
when = { months = [1, 2], weekdays = ["mon", "tue", "wed", "thu", "fri", "sat"] }
blocks = [
  { from = 8, to = 16, activity = "cut_ice", fallback = "tend_stock", priority = 28, duty = 500, who = { min_age = 16 }, attend = { base_pct = 30, value_pct = { thrift = 5 } } },
]
