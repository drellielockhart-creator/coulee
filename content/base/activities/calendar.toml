# The human calendar and the daily round (05 §4.3, §4.6). OWNER: module:needs-activities.
#
# An observance is active on days that satisfy every `when` condition. Its blocks call
# actors who pass `who` and (if `attend` is given) win a once-a-day roll:
#     chance% = base_pct + Σ (value step × value_pct) + Σ trait add      (clamped 0..100)
# Occupation schedule blocks have priority 20 and sleep 100; a block with a higher priority
# replaces the occupation's activity for those hours. Hours may be anchored to sunrise/sunset.
#
# Seasonal hours (05 §4.2): the same clock hour is a different day in June and January, so the
# night is two observances.

# ---- The daily round ---------------------------------------------------------------------

[[observance]]
id = "night_long"
name = "The long nights"
description = "Dark by five and cold: early to bed, late to rise (Oct-Apr)."
when = { months = [10, 11, 12, 1, 2, 3, 4] }
blocks = [{ from = 21, to = 6, activity = "sleep", priority = 10, duty = 300 }]

[[observance]]
id = "night_short"
name = "The short nights"
description = "Light at four, and the hay won't wait (May-Sep)."
when = { months = [5, 6, 7, 8, 9] }
blocks = [{ from = 22, to = 5, activity = "sleep", priority = 10, duty = 300 }]

[[observance]]
id = "daily_meals"
name = "Meals"
description = "Breakfast, dinner at noon, supper at six. Provisions decides what is on the table."
when = { weekdays = ["sun", "mon", "tue", "wed", "thu", "fri", "sat"] }
blocks = [
  { from = 6, to = 7, activity = "cook_meal", priority = 38, duty = 350, who = { min_age = 15, max_age = 70, rota = true } },
  { from = 7, to = 8, activity = "take_meal", priority = 40, duty = 450 },
  { from = 11, to = 12, activity = "cook_meal", priority = 38, duty = 350, who = { min_age = 15, max_age = 70, rota = true } },
  { from = 12, to = 13, activity = "take_meal", priority = 40, duty = 450 },
  { from = 17, to = 18, activity = "cook_meal", priority = 38, duty = 350, who = { min_age = 15, max_age = 70, rota = true } },
  { from = 18, to = 19, activity = "take_meal", priority = 40, duty = 450 },
]

[[observance]]
id = "evening_tavern"
name = "An evening at the tavern"
description = "Weekday evenings: the grown and the thirsty. The pious stay home."
when = { weekdays = ["mon", "tue", "wed", "thu", "fri", "sat"] }
blocks = [
  { from = 19, to = 22, activity = "drink_at_tavern", priority = 22, duty = 250, who = { min_age = 18 }, attend = { base_pct = 14, value_pct = { neighborliness = 4, piety = -5, temper = 2 }, trait_pct = { gossip = 8 } } },
]

[[observance]]
id = "evening_visiting"
name = "Visiting"
description = "Calling on kin and neighbors after supper."
when = { weekdays = ["mon", "tue", "wed", "thu", "fri", "sat"] }
blocks = [
  { from = 19, to = 21, activity = "visit_kin", priority = 22, duty = 250, attend = { base_pct = 14, value_pct = { neighborliness = 6 }, trait_pct = { gossip = 12 }, weather_pct = [{ below_f = 32, pct = 50, label = "Snowbound roads" }, { below_f = 20, pct = 25, label = "Bitter cold" }] } },
]

[[observance]]
id = "school_winter_term"
name = "The winter term"
description = "School keeps from November to April, when the farm children can be spared."
when = { weekdays = ["mon", "tue", "wed", "thu", "fri"], months = [11, 12, 1, 2, 3, 4] }
blocks = [
  { from = 9, to = 12, activity = "attend_school", fallback = "keep_house", priority = 50, duty = 600, who = { min_age = 6, max_age = 14 }, attend = { base_pct = 85, value_pct = { thrift = -3 } } },
  { from = 13, to = 16, activity = "attend_school", fallback = "keep_house", priority = 50, duty = 600, who = { min_age = 6, max_age = 14 }, attend = { base_pct = 85, value_pct = { thrift = -3 } } },
]

[[observance]]
id = "school_summer_term"
name = "The summer term"
description = "A short summer term for the little ones; the big ones are in the fields."
when = { weekdays = ["mon", "tue", "wed", "thu", "fri"], months = [6, 7, 8] }
blocks = [
  { from = 9, to = 12, activity = "attend_school", fallback = "keep_house", priority = 50, duty = 500, who = { min_age = 6, max_age = 10 }, attend = { base_pct = 60 } },
]

# ---- The Sabbath, Holy Week, and feast days ----------------------------------------------

[[observance]]
id = "sabbath"
name = "The Sabbath"
description = "Most work stops. Stores are shut; stock must still be fed. Church is the week's gossip hub."
when = { weekdays = ["sun"] }
rest_labor = true
rest_activity = "sabbath_rest"
exempt_roles = ["preacher"]
closes = ["store", "smithy", "mill"]
blocks = [
  { from = 10, to = 12, activity = "preach_service", priority = 70, duty = 800, who = { roles = ["preacher"] } },
  { from = 10, to = 12, activity = "attend_church", fallback = "sabbath_rest", priority = 60, duty = 450, norm = "piety", speaker = "The Pastor", duty_values = { piety = 70 }, announce = true, attend = { base_pct = 58, value_pct = { piety = 14 }, trait_pct = { pious = 10 } }, who = { not_roles = ["preacher"] } },
  { from = 14, to = 17, activity = "visit_kin", priority = 25, duty = 300, attend = { base_pct = 38, value_pct = { neighborliness = 6 }, trait_pct = { gossip = 10 }, weather_pct = [{ below_f = 32, pct = 50, label = "Snowbound roads" }, { below_f = 20, pct = 25, label = "Bitter cold" }] } },
  { from = 15, to = 18, activity = "drink_at_tavern", priority = 24, duty = 250, who = { min_age = 18 }, attend = { base_pct = 12, value_pct = { piety = -8, neighborliness = 3 } } },
  { from = 19, to = 20, activity = "family_devotions", priority = 26, duty = 350, norm = "piety", attend = { base_pct = 45, value_pct = { piety = 14 } } },
]

[[observance]]
id = "palm_sunday"
name = "Palm Sunday"
description = "The first day of the run, and the start of Holy Week: the pews fill."
when = { easter_offset = -7 }
blocks = [
  { from = 10, to = 12, activity = "attend_church", fallback = "sabbath_rest", priority = 62, duty = 550, norm = "piety", duty_values = { piety = 70 }, announce = true, attend = { base_pct = 70, value_pct = { piety = 12 } }, who = { not_roles = ["preacher"] } },
]

[[observance]]
id = "good_friday"
name = "Good Friday"
description = "A quiet day. The faithful gather in the evening; trade is slow."
when = { easter_offset = -2 }
blocks = [
  { from = 19, to = 21, activity = "attend_church", fallback = "family_devotions", priority = 55, duty = 500, norm = "piety", duty_values = { piety = 70 }, announce = true, attend = { base_pct = 35, value_pct = { piety = 16 } }, who = { not_roles = ["preacher"] } },
  { from = 19, to = 21, activity = "preach_service", priority = 70, duty = 800, who = { roles = ["preacher"] } },
]

[[observance]]
id = "easter_sunday"
name = "Easter Sunday"
description = "Sunrise service, the full church, the feast."
when = { easter_offset = 0 }
blocks = [
  { from = 6, to = 7, activity = "attend_church", priority = 66, duty = 550, norm = "piety", duty_values = { piety = 70 }, attend = { base_pct = 30, value_pct = { piety = 16 } }, who = { not_roles = ["preacher"] } },
  { from = 10, to = 12, activity = "attend_church", fallback = "sabbath_rest", priority = 65, duty = 600, norm = "piety", duty_values = { piety = 70 }, announce = true, attend = { base_pct = 82, value_pct = { piety = 8 } }, who = { not_roles = ["preacher"] } },
]

[[observance]]
id = "fourth_of_july"
name = "The Fourth of July"
