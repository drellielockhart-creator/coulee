  { from = 14, to = 17, activity = "visit_kin", priority = 40, duty = 400, attend = { base_pct = 60, value_pct = { neighborliness = 6 }, weather_pct = [{ below_f = 32, pct = 50, label = "Snowbound roads" }, { below_f = 20, pct = 25, label = "Bitter cold" }] } },
]

[[observance]]
id = "county_fair"
