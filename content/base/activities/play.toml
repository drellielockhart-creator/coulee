# Ordinary activities usable by any actor; headless movement never mutates location itself.
[[activity]]
id = "walk"
name = "Walk"
verb = "walking about"
at = "anywhere"
labor = "light"
tags = ["travel"]

# Deliberate quiet recovery, available wherever the actor is standing.
[[activity]]
id = "rest"
name = "Rest"
verb = "resting quietly"
at = "anywhere"
labor = "rest"
needs = { rest = 40 }
tags = ["leisure"]

# A deliberate waking order; ordinary rest remains an hour-long activity.
[[activity]]
id = "wake"
name = "Wake"
verb = "getting up"
at = "anywhere"
labor = "rest"
short_act = true
minutes = 1
