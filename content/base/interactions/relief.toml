[[interaction]]
id = "give_relief"
name = "Give food in relief"
label = "Bring food"
relief = "give"
urge_only = true
requires = { min_age = 16 }
cooldown_hours = 24
tags = ["relief", "friendly"]
memory = { kind = "help", emotion = "gratitude", intensity = 45 }
