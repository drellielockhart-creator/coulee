# Hostility (04 §10 #7-#9, #25, #33, #39). OWNER: module:social.
# Tag `displacement` marks interactions a displaced rage can discharge through (10 §7);
# the defense table in social/tuning.toml picks among them.

[[interaction]]
id = "slight"
name = "Slight"
label = "Slight"
description = "A curt word, a turned shoulder at the counter."
requires = { acquainted = true, max_affection = 0, min_age = 8, target_min_age = 6 }
volition = [
  { driver = "opinion:affection", weight = -20 },
  { driver = "value:temper", weight = 8 },
  { driver = "grudge", weight = 20 },
  { driver = "condition:drunk", weight = 15 },
  { driver = "household", weight = -10 },
]
threshold = 20
cooldown_hours = 12
memory = { kind = "slight", emotion = "anger", intensity = 25 }
tags = ["hostile", "displacement"]
success.target_opinion = { affection = -5 }
success.target_memory = "{initiator} was short with me at {place}"
success.initiator_memory = "Was short with {target}"
success.witness_memory = "{initiator} was short with {target} at {place}"
success.target_reason = "Was short with me at {place}"

