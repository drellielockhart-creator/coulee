# Everyday sociability (04 §10 #1-#6, #18, #19, #20, #35, #36). OWNER: module:social.
#
# Format notes (see packages/content/src/schema/social.ts):
# - `requires` gates on the initiator's view of the target; opinion gates (min/max
#   affection, trust, respect, fear, grudge, familiarity) only apply to spontaneous
#   choices. An urge the psyche (or a player Command) chose skips them and the threshold.
# - `volition` drivers are summed (integer weights) plus 0..15 noise; the best one over
#   its `threshold` is chosen for a spontaneous encounter.
# - Opinion deltas become Reasons that cite the holder's memory, so they fade as the
#   memory's salience decays (04 §6.2). `volatile = true` uses the fast daily bucket.
# - Placeholders in texts: {initiator} {target} {place} {cents}.

[[interaction]]
id = "chat"
name = "Chat"
label = "Chat"
description = "Weather, crops, prices: the glue of a village."
volition = [
  { driver = "need:company", weight = 30 },
  { driver = "opinion:affection", weight = 10 },
  { driver = "familiarity", weight = 10 },
]
memory = { kind = "chat", intensity = 5 }
minutes = 10
tags = ["friendly"]
success.volatile = true
success.target_opinion = { affection = 3 }
success.initiator_opinion = { affection = 3 }
success.initiator_needs = { company = 60 }
success.target_needs = { company = 60 }
success.audience = "none"
success.target_memory = "Passed the time with {initiator} at {place}"
success.initiator_memory = "Passed the time with {target} at {place}"

