# ---- Choler (rage): opinions and memories cue it (04 §3.6) -------------------------------

[[thought]]
id = "rage_hostile"
voice = "id"
drive = "rage"
target = { pick = "hostile", present = "any", affection_max = -30, temper_slack = 7, per_point = 10, absent_pct = 60 }
urge = { kind = "interaction", id = "insult" }
base = 150
decay_per_hour = 250
fallback = false
notable = true
label = "Choler: have it out with {target}"
lines = ["I've half a mind to tell {target} exactly what I think.", "{target} won't get away with it.", "Every time I see {target} my jaw sets."]

[[thought]]
id = "rage_remembered"
voice = "id"
drive = "rage"
target = { pick = "memory", emotions = ["anger"], salience_min = 300, per_point = 5, absent_pct = 50 }
urge = { kind = "interaction", id = "insult" }
base = 100
decay_per_hour = 200
fallback = false
label = "Choler: what {target} did"
lines = ["I keep going over what {target} did.", "I haven't forgotten, {target}. I won't."]

