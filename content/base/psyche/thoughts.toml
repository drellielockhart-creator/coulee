# Thought generators (10 §4.2, §14.3). OWNER: module:psyche.
#
# Psyche fills gaps: other modules propose the situational urges (needs: hunger/rest/company;
# activity: schedule duty; social: confront, court; belief: avoid, accuse; provisions: eat,
# buy). A rule with `fallback = true` (the default) is skipped for an actor when another
# module already proposed for the same drive/norm, or the same urge with the same voice,
# this hour. Rules marked `fallback = false` are psyche's own (memory, opinion and situation
# cues) and always run.
#
# Intensity (0..1000): base, or the need deficit floor((at - value) × 1000 / at), or the
# schedule block's duty, plus the target term; then × (50 + idAppetite or strictness)/100,
# × drive weight or norm strength /50, × trait voice_pct and urge_bias. Each step is an
# Explain term, so the UI can show why a thought is as loud as it is.
#
# Lines: {target} = the other person, {option} = the option's name, {verb} = its verb.

# ---- Appetite (hunger) ------------------------------------------------------------------

[[thought]]
id = "hunger_eat"
voice = "id"
drive = "hunger"
when = { need_below = { need = "hunger", at = 600 } }
urge = { kind = "activity", id = "take_meal" }
decay_per_hour = 200
label = "Appetite: eat something"
lines = ["My belly's an empty kettle.", "I could eat a horse, harness and all.", "Something to eat. Now."]

[[thought]]
id = "hunger_dram_evening"
voice = "id"
drive = "hunger"
when = { hours = { from = 18, to = 23 }, norm_max = { temperance = 45 } }
urge = { kind = "activity", id = "drink_at_tavern" }
base = 220
decay_per_hour = 220
fallback = false
label = "Appetite: a glass down the road"
lines = ["A dram would settle the day.", "Just the one. Where's the harm?"]

[[thought]]
id = "hunger_dram_nerves"
voice = "id"
drive = "hunger"
when = { anxiety_min = 350, hours = { from = 12, to = 23 } }
urge = { kind = "activity", id = "drink_at_tavern" }
base = 300
decay_per_hour = 200
fallback = false
notable = true
label = "Appetite: something to steady the nerves"
lines = ["A drink would stop my hands shaking.", "Something to steady me. Just tonight."]

# ---- Ease (sloth) -----------------------------------------------------------------------

[[thought]]
id = "sloth_sleep"
voice = "id"
drive = "sloth"
when = { need_below = { need = "rest", at = 600 } }
urge = { kind = "activity", id = "sleep" }
decay_per_hour = 200
label = "Ease: lie down"
lines = ["My eyes are full of sand.", "Lie down. Just for an hour."]

[[thought]]
id = "sloth_warm_bed"
voice = "id"
drive = "sloth"
when = { asleep = true, scheduled_tags = ["labor"] }
against_tags = ["labor"]
base = 240
decay_per_hour = 300
fallback = false
label = "Ease: not yet"
lines = ["Five minutes more. {option} will keep.", "Warm here. Let it wait."]

[[thought]]
id = "sloth_worn_out"
voice = "id"
drive = "sloth"
when = { need_below = { need = "rest", at = 400 }, scheduled_tags = ["labor"] }
against_tags = ["labor"]
decay_per_hour = 250
fallback = false
label = "Ease: done in"
lines = ["My back's done for the day, whatever the clock says.", "I can't lift another thing."]

