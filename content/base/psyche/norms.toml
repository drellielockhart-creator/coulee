# Norms: the Superego's content (10 §3.3). OWNER: module:psyche.
#
# strength = base + Σ value × coefficient + trait shifts (+ scenario override), clamped 0..100.
# 04 reads them back as Values: view = clamp(-3, 3, floorDiv(strength - 50, 15)).
# A prohibition thought's intensity is relevance×10 × (50 + strictness)/100 × strength/50,
# plus min(300, 50 × onlookers) for public norms. Lines: {option} = the forbidden option.

[[norm]]
id = "duty"
name = "Duty"
period_label = "Diligence"
description = "Work comes first; you keep your hours and your word."
speaker = "Father"
source = "parent"
base = 55
forbids = [
  { tags = ["leisure", "carouse"], relevance = 40, when = { scheduled_tags = ["labor"] } },
  { tags = ["rest"], relevance = 30, when = { scheduled_tags = ["labor"] } },
]
lines = [
  "There's work wanting, and you're thinking of {option}?",
  "Daylight's for working. {option} can wait.",
]

[[norm]]
id = "piety"
name = "Piety"
period_label = "Veneration"
description = "Church, prayer, and the Sabbath kept."
speaker = "the Pastor"
source = "church"
base = 50
values = { piety = 15 }
forbids = [
  { tags = ["labor", "trade"], relevance = 60, when = { sabbath = true } },
  { tags = ["carouse"], relevance = 40 },
]
lines = [
  "Remember the Sabbath day, to keep it holy.",
  "Is {option} how a Christian spends the Lord's time?",
]

[[norm]]
id = "temperance"
name = "Temperance"
period_label = "Temperance"
description = "Liquor ruins homes. Held hard in 1855, the year of the Maine Law fight."
speaker = "Mother"
source = "parent"
base = 50
values = { piety = 8, temper = -4 }
forbids = [{ tags = ["drink"], relevance = 50 }]
lines = [
  "Wine is a mocker, strong drink is raging.",
  "Not one glass. You know where one glass goes.",
]

[[norm]]
