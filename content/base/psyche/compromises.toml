# Compromise and sublimation templates (10 §5.3). OWNER: module:psyche.
#
# Compromise: when the two best options are within 200 and voiced by opposite agencies (or
# the winner is opposed by the other agency), the ego tries d20 + egoMod - band ≥
# 10 + floor(tension/100). On success the template's result is chosen, and the frustrated
# thoughts of each side keep id_pct / superego_pct of their satisfaction (less anxiety).
#
# Sublimation: a drive frustrated 3+ hours running, E ≥ 55: d20 + egoMod ≥ 12 turns it into
# the template's urge, and the drive's frustration is spent.

[[compromise]]
id = "bite_at_the_bench"
label = "A quick bite, then back to it"
id_side = { drives = ["hunger"], tags = ["eat"] }
superego_side = { norms = ["duty"], tags = ["labor"] }
result = { kind = "side", side = "id" }
id_pct = 80
superego_pct = 50

